# Only used by a temporary manual Application for signed write-back verification.
# The verification Application is never synced and this Deployment has no Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-updater-verification
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-updater-verification
  template:
    metadata:
      labels:
        app: image-updater-verification
    spec:
      automountServiceAccountToken: false
      containers:
        - name: verification
          image: ghcr.io/pmh-only/mail:latest
