apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cap-secrets
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: cap/cap-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: cap-secrets
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: cap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cap
    serviceAccount: vault-auth
    audiences:
      - vault
