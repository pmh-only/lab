apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cap-ingress
spec:
  podSelector:
    matchLabels:
      app: cap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cap-valkey-ingress
spec:
  podSelector:
    matchLabels:
      app: cap-valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cap
      ports:
        - port: 6379
          protocol: TCP
