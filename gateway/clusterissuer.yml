apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: pmh_only@pmh.codes
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-issuer-account-key
    profile: shortlived
    preferredChain: "ISRG Root YE"
    solvers:
      - dns01:
          webhook:
            groupName: acme.xver.cloud
            solverName: technitium
            config:
              serverUrl: http://nameserver.nameserver.svc.cluster.local:5380
              authTokenSecretRef:
                key: api-token
                name: technitium-api-token
        selector:
          dnsZones:
            - as218822.net
            - not.ai.kr
            - pmh.so
            - pmh.codes

      - http01:
          gatewayHTTPRoute:
            serviceType: ClusterIP
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: main
                namespace: gateway
                sectionName: http
