# Shared by bootstrap/default and publicly trusted virtual hosts.
# HSTS/preload and QUIC remain disabled until service migration is complete.
add_header X-Content-Type-Options nosniff always;

if ($private_management_host) { return 403; }

location = /_gwhealthz {
  default_type text/plain;
  return 200 "Gateway HTTPS is running; $edge_tls_status\n";
}

location / {
  set $envoy_gateway envoy-gateway-main.envoy-gateway-system.svc.cluster.local;
  proxy_pass http://$envoy_gateway:80;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
