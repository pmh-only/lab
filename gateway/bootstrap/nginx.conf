worker_processes 2;
# The pinned scratch-based image has no /var/run directory.
pid /nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;

  resolver kube-dns.kube-system.svc.cluster.local valid=30s;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # The existing Envoy route must remain private during bootstrap.
  map $host $private_management_host {
    default 0;
    names.pmh.codes 1;
  }

  server {
    listen 80 default_server;
    server_name _;

    if ($private_management_host) { return 403; }

    location = /_gwhealthz {
      default_type text/plain;
      return 200 "Gateway bootstrap HTTP is running\n";
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    http2 on;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    set $edge_tls_status "bootstrap certificate is not publicly trusted";
    include /etc/nginx/edge/https-server.conf;
  }

  # Only the publicly validated domain uses the production certificate.
  # Unmigrated zones and direct-IP requests keep the bootstrap default above.
  server {
    listen 443 ssl;
    server_name pmh.codes *.pmh.codes;
    http2 on;

    ssl_certificate /etc/nginx/public-tls/tls.crt;
    ssl_certificate_key /etc/nginx/public-tls/tls.key;
    set $edge_tls_status "public certificate for pmh.codes";
    include /etc/nginx/edge/https-server.conf;
  }
}
