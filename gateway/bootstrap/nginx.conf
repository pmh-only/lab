worker_processes 2;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;

  resolver kube-dns.kube-system.svc.cluster.local valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # The existing Envoy route must remain private during bootstrap.
  map $host $private_management_host {
    default 0;
    names.pmh.codes 1;
  }

  server {
    listen 80 default_server;
    server_name _;

    if ($private_management_host) { return 403; }

    location = /_gwhealthz {
      default_type text/plain;
      return 200 "Gateway bootstrap HTTP is running\n";
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    http2 on;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Do not advertise HSTS/preload or QUIC with temporary bootstrap TLS.
    add_header X-Content-Type-Options nosniff always;

    if ($private_management_host) { return 403; }

    location = /_gwhealthz {
      default_type text/plain;
      return 200 "Gateway bootstrap HTTPS is running; certificate is not publicly trusted\n";
    }

    location / {
      set $envoy_gateway envoy-gateway-main.envoy-gateway-system.svc.cluster.local;
      proxy_pass http://$envoy_gateway:80;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
