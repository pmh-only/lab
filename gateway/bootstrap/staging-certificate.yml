# Exercise public DNS01 without replacing the currently served bootstrap TLS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-pmh-codes-staging
spec:
  secretName: gateway-pmh-codes-staging
  dnsNames:
    - pmh.codes
    - "*.pmh.codes"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - server auth
