apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls-secret
  namespace: gateway
spec:
  secretTemplate:
    labels:
      edge.pmh.codes/reload: "true"
  # IP identifiers require Let's Encrypt's shortlived profile. Renew with
  # enough overlap for automatic Secret propagation and the edge rollout.
  renewBefore: 48h
  dnsNames:
    - as218822.net
    - pmh.so
    - pmh.codes

    - "*.a.certificate.for.pmh.codes"

    - "*.pmh.so"
    - "*.pmh.codes"

    - "*.here.pmh.so"
    - "*.here.pmh.codes"

    - "*.s3.pmh.so"
    - "*.s3.pmh.codes"

    - "*.mc.pmh.so"
    - "*.mc.pmh.codes"

    - not.ai.kr
  ipAddresses:
    - "168.110.121.95"
    - "138.2.112.39"
    - "168.107.39.218"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: gateway-tls-secret
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 384
  usages:
    - digital signature
    - key encipherment
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gateway-ech-secrets
  namespace: gateway
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: gateway/gateway-ech-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: gateway-ech-secrets
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: gateway
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: gateway
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: gateway
    serviceAccount: vault-auth
    audiences:
    - vault
