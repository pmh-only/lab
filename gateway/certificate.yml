apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls-secret
  namespace: gateway
spec:
  dnsNames:
    - pmh.so
    - pmh.codes

    - "*.a.certificate.for.pmh.codes"

    - "*.pmh.so"
    - "*.pmh.codes"

    - "*.here.pmh.so"

    - "*.s3.pmh.so"
    - "*.s3.pmh.codes"

    - "*.mc.pmh.so"
    - "*.mc.pmh.codes"

    - not.ai.kr
  ipAddresses:
    - "158.179.174.47"
    - "144.24.77.19"
    - "140.245.78.145"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: gateway-tls-secret
  privateKey:
    algorithm: ECDSA
    size: 384
  usages:
    - digital signature
    - key encipherment
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gateway-ech-secrets
  namespace: gateway
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: gateway/gateway-ech-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: gateway-ech-secrets
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: gateway
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: gateway
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: gateway
    serviceAccount: vault-auth
    audiences:
    - vault
