apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway
resources:
  - ./certificate.yml
  - ./clusterissuer.yml
  - ./nginx.yml
  - ./envoy.yml
  - ./backend-policy.yml
  - ./service-alias.yml
  - ./public-certificate.yml
# First issue the complete original certificate while the current edge
# certificate continues serving. Remove this mount override after Ready=True.
patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: gateway-nginx
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: gateway-nginx
      spec:
        template:
          spec:
            volumes:
              - name: tls
                secret:
                  secretName: gateway-pmh-codes-tls
images:
  - name: ghcr.io/pmh-only/nginx
    newTag: latest
    digest: sha256:2565f5f6088bd57275fa4b58a75d188d63e856f7b542220361fc185f2c95165e
