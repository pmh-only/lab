apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway
resources:
  - ./certificate.yml
  - ./nginx.yml
  - ./envoy.yml
  - ./backend-policy.yml
  - ./service-alias.yml
  - ./public-certificate.yml
# Preserve the original full certificate declaration without requesting retired
# IPs or unmigrated domains. Keep the newly issued certificate during migration.
patches:
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: gateway-tls-secret
    patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: gateway-tls-secret
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: gateway-nginx
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: gateway-nginx
      spec:
        template:
          spec:
            volumes:
              - name: tls
                secret:
                  secretName: gateway-pmh-codes-tls
images:
  - name: ghcr.io/pmh-only/nginx
    newTag: latest
    digest: sha256:8807f1d55ed56587d9f218792cac57f2807075dffee7b9bf4dd5d8b089055333
