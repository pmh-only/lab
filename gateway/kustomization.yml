apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway
resources:
  - ./certificate.yml
  - ./clusterissuer.yml
  - ./nginx.yml
  - ./envoy.yml
  - ./backend-policy.yml
  - ./service-alias.yml
  - ./public-certificate.yml
# Preserve the original full certificate declaration without requesting retired
# IPs or unmigrated domains. Keep the newly issued certificate during migration.
patches:
  # No old/fabricated Cloudflare token: keep the original issuer's active
  # Technitium/HTTP01 solvers until fresh not.ai.kr credentials are supplied.
  - target:
      group: cert-manager.io
      version: v1
      kind: ClusterIssuer
      name: letsencrypt
    patch: |-
      - op: remove
        path: /spec/acme/solvers/1
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: gateway-tls-secret
    patch: |-
      $patch: delete
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: gateway-tls-secret
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: gateway-nginx
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: gateway-nginx
      spec:
        template:
          spec:
            volumes:
              - name: tls
                secret:
                  secretName: gateway-pmh-codes-tls
images:
  - name: ghcr.io/pmh-only/nginx
    newTag: latest
    digest: sha256:2565f5f6088bd57275fa4b58a75d188d63e856f7b542220361fc185f2c95165e
