apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-pmh-codes
spec:
  secretName: gateway-pmh-codes-tls
  secretTemplate:
    labels:
      edge.pmh.codes/reload: "true"
  dnsNames:
    - as218822.net
    - not.ai.kr
    - pmh.so
    - "*.pmh.so"
    - "*.here.pmh.so"
    - "*.s3.pmh.so"
    - "*.mc.pmh.so"
    - pmh.codes
    - "*.pmh.codes"
    - "*.a.certificate.for.pmh.codes"
    - "*.s3.pmh.codes"
    - "*.mc.pmh.codes"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-public
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - server auth
