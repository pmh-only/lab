---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: heartbeat-secret
  namespace: heartbeat
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: heartbeat/heartbeat-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: heartbeat-secret
    type: Opaque
    labels:
      app.kubernetes.io/instance: heartbeat
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: heartbeat
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: heartbeat
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: heartbeat
    serviceAccount: vault-auth
    audiences:
    - vault
