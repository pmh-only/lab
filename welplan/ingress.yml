apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: welplan-route
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - welplan.pmh.codes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: welplus.welstory.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
