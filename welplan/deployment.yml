apiVersion: apps/v1
kind: Deployment
metadata:
  name: welplan
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: welplan
  template:
    metadata:
      labels:
        app: welplan
    spec:
      automountServiceAccountToken: false
      containers:
        - name: welplan
          image: ghcr.io/pmh-only/welplan2:latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 90
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          env:
            - name: ORIGIN
              value: https://welplan.pmh.codes
            - name: WELPLAN_VERBOSE_LOGS
              value: '0'
            - name: WELSTORY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: WELSTORY_USERNAME
            - name: WELSTORY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: WELSTORY_PASSWORD
            - name: PGHOST
              value: pgsql-service.database.svc.cluster.local
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: welplan
            - name: PGUSER
              value: welplan
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: PGPASSWORD
            - name: ADMIN_OIDC_DISCOVERY_URL
              value: https://auth.pmh.codes/application/o/welplan/.well-known/openid-configuration
            - name: ADMIN_OIDC_SCOPES
              value: openid profile email
            - name: ADMIN_OIDC_ISSUER_URL
              value: https://auth.pmh.codes/application/o/welplan/
            - name: ADMIN_OIDC_CLIENT_ID
              value: oFx8CL9kOoONKQW7hzMem9c4IN2dYkJ1alN1ihHK
            - name: ADMIN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: welplan-admin-oidc
                  key: ADMIN_OIDC_CLIENT_SECRET
            - name: REDIS_URL
              value: redis://redis-service.database.svc.cluster.local:6379
            - name: INDEXNOW_KEY
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: INDEXNOW_KEY
            - name: WEBSHARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: WEBSHARE_API_TOKEN
            - name: REVIEW_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: REVIEW_JWT_SECRET
            - name: SLACK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: SLACK_CLIENT_ID
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: SLACK_CLIENT_SECRET
            - name: SLACK_OAUTH_REDIRECT_URI
              value: 'https://welplan.pmh.codes/webhooks/slack/callback'
            - name: WEBMCP_ORIGIN_TRIAL_TOKEN
              value: Amg0Ensmuk/DoncbVVEpZAlIuX4Fn7tHtvJYHzG5f90rwXaOyxvK69n+RPLhgc2mVT8ITMWbPCv0kDKAuQ6jsgwAAABReyJvcmlnaW4iOiJodHRwczovL3dlbHBsYW4ucG1oLmNvZGVzOjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE3OTQ4NzM2MDB9
