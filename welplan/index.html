<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서비스 이용이 일시 중단되었습니다.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: #fafafa;
      color: #242424;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.8;
      word-break: keep-all;
    }
    main { width: 100%; max-width: 640px; }
    h1 { margin: 0 0 24px; font-size: clamp(24px, 4vw, 30px); line-height: 1.5; }
    p { margin: 12px 0; color: #555; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>서비스 이용이 일시 중단되었습니다.</h1>
    <p>본 서비스는 관련 권리자와의 협의가 완료되지 않아 제공을 중단했습니다.</p>
    <p>이용에 불편을 드려 죄송합니다.</p>
  </main>
</body>
</html>
