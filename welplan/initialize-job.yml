apiVersion: batch/v1
kind: Job
metadata:
  name: welplan-initialize-schema
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: prepare-native-safety
          image: ghcr.io/pmh-only/welplan2:latest
          command: [node, /bootstrap/prepare-safety.mjs]
          volumeMounts:
            - name: native-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: prepared-native
              mountPath: /prepared
      containers:
        - name: initialize
          image: ghcr.io/pmh-only/welplan2:latest
          command:
            - node
            - --input-type=module
            - -e
            - |
              const module = await import('/app/worker/dist/webapp/src/lib/server/db/index.js');
              await module.ensureDbInitialized();
              console.log('Native Welplan schema initialized with its own database identity; no vendor login, user data or Slack messages generated');
              process.exit(0);
          env:
            - name: PGHOST
              value: pgsql-service.database.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: welplan
            - name: PGUSER
              value: welplan
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: welplan-secret
                  key: PGPASSWORD
          volumeMounts:
            - name: prepared-native
              mountPath: /app/worker/dist/webapp/src/lib/server/db/index.js
              subPath: worker-db.js
              readOnly: true
      volumes:
        - name: native-bootstrap
          configMap:
            name: welplan-native-bootstrap
        - name: prepared-native
          emptyDir: {}
