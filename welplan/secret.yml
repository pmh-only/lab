---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: welplan-secret
  namespace: welplan
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: welplan/welplan-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: welplan-secret
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: welplan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: welplan
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: welplan
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: welplan
    serviceAccount: vault-auth
    audiences:
    - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: welplan-admin-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: welplan/admin-oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: welplan-admin-oidc
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: welplan
