---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: thanos-secrets
  namespace: monitoring
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: monitoring/thanos-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: thanos-secrets
    type: Opaque
