apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: monitoring-secret
  namespace: monitoring
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: monitoring/monitoring-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: monitoring-secret
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: monitoring
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: monitoring
    serviceAccount: vault-auth
    audiences:
    - vault
