apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: tailscale/operator-oauth
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: operator-oauth
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: tailscale
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: tailscale
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: tailscale
    serviceAccount: vault-auth
    audiences:
    - vault
