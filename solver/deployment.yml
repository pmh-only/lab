apiVersion: apps/v1
kind: Deployment
metadata:
  name: solver
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: solver
  template:
    metadata:
      labels:
        app: solver
    spec:
      runtimeClassName: sysbox-runc
      hostUsers: false
      serviceAccountName: solver
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: initialize-native-web
          image: ghcr.io/pmh-only/solver:latest
          securityContext:
            privileged: false
          command: [/bin/sh, -ec]
          args:
            - |
              chown 1000:1000 /data /prepared
              exec gosu agent node /bootstrap/initialize.mjs
          env:
            - name: KV_STORE_PATH
              value: /data/kv.sqlite
            - name: WEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: solver-internal
                  key: WEB_SESSION_SECRET
            - name: WEB_ADMIN_SUBJECTS
              valueFrom:
                secretKeyRef:
                  name: solver-internal
                  key: WEB_ADMIN_SUBJECTS
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: solver-oidc
                  key: client-secret
          volumeMounts:
            - name: solver-pvc
              mountPath: /data
            - name: native-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: prepared-native
              mountPath: /prepared
      containers:
        - name: solver
          image: ghcr.io/pmh-only/solver:latest
          env:
            - name: WEB_DOMAIN
              value: https://solver.pmh.codes
            - name: WEB_TRUST_PROXY
              value: 'true'
            - name: WEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: solver-internal
                  key: WEB_SESSION_SECRET
            - name: AGENT_TZ
              value: Asia/Seoul
            - name: DISCORD_CLIENT_ID
              value: '1563036864989106176'
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: solver-secret
                  key: DISCORD_TOKEN
            - name: IMAP_HOST
              value: imap.purelymail.com
            - name: IMAP_PORT
              value: '993'
            - name: IMAP_SECURE
              value: 'true'
            - name: IMAP_USER
              value: pmh_only@pmh.codes
            - name: IMAP_MAILBOX
              value: INBOX
            - name: IMAP_PASS
              valueFrom:
                secretKeyRef:
                  name: solver-secret
                  key: IMAP_PASS
            - name: KV_STORE_PATH
              value: /data/kv.sqlite
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: solver-secret
                  key: FIRECRAWL_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: solver-secret
                  key: OPENAI_API_KEY
            - name: OPENAI_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: solver-secret
                  key: OPENAI_ADMIN_KEY
            - name: ADMIN_USER_IDS
              value: '527746745073926145,1394480368878485616'
          volumeMounts:
            - mountPath: /data
              name: solver-pvc
            # Native hosted/shared HTML uses process.cwd()/data, not KV_STORE_PATH.
            - mountPath: /app/data
              name: solver-pvc
            - name: docker-sock
              mountPath: /var/run
            - name: prepared-native
              mountPath: /app/dist/web-server.js
              subPath: web-server.js
              readOnly: true
            - name: cluster-view
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 3Gi
        - name: dind
          image: docker:29-dind
          securityContext:
            privileged: false
          # Run only a Pod-local Unix socket; do not expose unauthenticated TCP.
          command: [dockerd]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          args:
            - --host=unix:///var/run/docker.sock
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 5
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: solver-pvc
          persistentVolumeClaim:
            claimName: solver-pvc
        - name: docker-sock
          emptyDir: {}
        - name: docker-data
          emptyDir:
            sizeLimit: 10Gi
        - name: native-bootstrap
          configMap:
            name: solver-native-bootstrap
        - name: prepared-native
          emptyDir: {}
        # Keep the original read-only Kubernetes view capability in Solver only.
        # Docker and bootstrap containers receive no Kubernetes API token.
        - name: cluster-view
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
