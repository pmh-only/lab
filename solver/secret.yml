---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: solver-secret
  namespace: solver
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: solver/solver-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: solver-secret
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: solver-oidc
  namespace: solver
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: solver/solver-oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: solver-oidc
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: solver-internal
  namespace: solver
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: solver/internal
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: solver-internal
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: solver
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: solver
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: solver
    serviceAccount: vault-auth
    audiences:
    - vault
