apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: cert-manager
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: cert-manager
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cert-manager
    serviceAccount: vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: technitium-api-token
  namespace: cert-manager
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: cert-manager/technitium-api-token
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: technitium-api-token
    type: Opaque
