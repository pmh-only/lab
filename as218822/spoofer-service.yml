apiVersion: v1
kind: Service
metadata:
  name: spoofer-router
  namespace: as218822
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  # Router diagnostics must not depend on unrelated sidecar readiness.
  publishNotReadyAddresses: true
  selector:
    app: bird
  ports:
    - name: segment-a
      protocol: UDP
      port: 51830
      targetPort: 51830
    - name: segment-b
      protocol: UDP
      port: 51831
      targetPort: 51831
