apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: console-oidc
  namespace: as218822
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: as218822/console-oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: console-oidc
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: as218822
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: as218822
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: as218822
    serviceAccount: vault-auth
    audiences:
    - vault
