apiVersion: v1
kind: Service
metadata:
  name: gre-gateway
  namespace: as218822
spec:
  publishNotReadyAddresses: true
  selector:
    app: bird-gre-gateway
  ports:
    - name: ip-tunnel
      protocol: UDP
      port: 51820
      targetPort: 51820
    - name: wireguard
      protocol: UDP
      port: 51821
      targetPort: 51821
