apiVersion: v1
kind: ConfigMap
metadata:
  name: router-public-config
  namespace: as218822
data:
  # Public keys derived from the existing Vault-held internal/portal identities.
  # External upstream private keys remain in the original encrypted dotenv.
  WG_CORE_PUBLIC_KEY: bRqN6RYbr1KgvPU6RL8xUtmddng370XPT+jTuLB5hDo=
  WG_GRE_GATEWAY_PUBLIC_KEY: QwCxTrzHIbswN/3nXXou6mB0fsVZOAiDr0UI23W0awQ=
  WG_PORTAL_PUBLIC_KEY: Cbx+GrJHZ1hGgaKCsYUCkkJidfc3ydWnbN5oaChmWT0=
  gre-gateway.conf: |
    [Interface]
    Address = fd00:218:822:100::/127
    PrivateKey = ${WG_CORE_PRIVATE_KEY}
    Table = off
    MTU = 1420

    [Peer]
    PublicKey = ${WG_GRE_GATEWAY_PUBLIC_KEY}
    Endpoint = gre-gateway.as218822.svc.cluster.local:51821
    AllowedIPs = ::/0
    PersistentKeepalive = 25
  core.conf: |
    [Interface]
    Address = fd00:218:822:100::1/127
    ListenPort = 51821
    PrivateKey = ${WG_GRE_GATEWAY_PRIVATE_KEY}
    Table = off
    MTU = 1420

    [Peer]
    PublicKey = ${WG_CORE_PUBLIC_KEY}
    AllowedIPs = ::/0
