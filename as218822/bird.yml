apiVersion: v1
kind: ServiceAccount
metadata:
  name: bird
  namespace: as218822
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bird
  namespace: as218822
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bird
  namespace: as218822
subjects:
  - kind: ServiceAccount
    name: bird
    namespace: as218822
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bird
---
apiVersion: v1
kind: Service
metadata:
  name: bird
  namespace: as218822
spec:
  clusterIP: None
  selector:
    app: bird
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bird
  namespace: as218822
spec:
  serviceName: bird
  replicas: 1
  selector:
    matchLabels:
      app: bird
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: address-website-tls
      labels:
        app: bird
    spec:
      serviceAccountName: bird
      runtimeClassName: sysbox-runc
      hostUsers: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: network-config
          image: ghcr.io/pmh-only/as218822:latest
          command:
            - /bin/sh
            - -ceu
            - |
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv6.conf.all.forwarding=1
              # Allow the existing root-group, non-root looking-glass process
              # to use ICMP echo datagram sockets without raw-socket privilege.
              sysctl -w 'net.ipv4.ping_group_range=0 0'
              ip -6 address replace 2a06:9801:ff0::/128 dev lo
              # Tailscale's marked transport must use the IPv4 underlay, not
              # the tunneled IPv6 network that it is responsible for serving.
              ip -6 rule add pref 5200 fwmark 0x80000/0xff0000 unreachable
              # Prefer Vultr for traffic sourced from the routed aggregate.
              ip -6 rule add pref 10000 from 2a06:9801:ff0::/44 table 218822
              # Preserve the original exit SNAT before Tailscale's priority-100
              # NAT without depending on host-loaded ip6_tables legacy modules.
              nft -f - <<'NFT'
              add table ip6 as218822_exit_snat
              delete table ip6 as218822_exit_snat
              table ip6 as218822_exit_snat {
                chain postrouting {
                  type nat hook postrouting priority 99; policy accept;
                  meta mark & 0xff0000 == 0x40000 snat to 2a06:9801:ff0::
                }
              }
              NFT
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
      containers:
        - name: bird
          image: ghcr.io/pmh-only/as218822:latest
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_BIND_SERVICE
                - NET_RAW
          env:
            - name: WG_GRE_GATEWAY_PUBLIC_KEY
              valueFrom:
                configMapKeyRef: {name: router-public-config, key: WG_GRE_GATEWAY_PUBLIC_KEY}
            - name: ANYCAST_RETURN_PATHS
              value: >-
                gre-gateway,218830,218830,9000
                hyehost-us,218831,218831,9001
                hyehost-uk,218832,218832,9002
                hyehost-nz,218833,218833,9003
                bgptunnel-no,218834,218834,9004
                bgptunnel-es,218835,218835,9005
                route64-sg,218836,218836,9006
            - name: DOTENV_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bird-dotenvx
                  key: DOTENV_PRIVATE_KEY
            - name: WG_CORE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: as218822-router-wireguard
                  key: WG_CORE_PRIVATE_KEY
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: router-public-config
              mountPath: /etc/tunnels/wireguard/gre-gateway.conf
              subPath: gre-gateway.conf
              readOnly: true
            - name: run
              mountPath: /run/bird
            - name: zerotier-state
              mountPath: /var/lib/zerotier-one
            - name: tun
              mountPath: /dev/net/tun
        - name: looking-glass
          image: ghcr.io/pmh-only/as218822-looking-glass:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          env:
            - name: LG_ALLOWED_ORIGINS
              value: https://as218822.net,https://www.as218822.net
            - name: LG_HOST
              value: 0.0.0.0
            - name: LG_LOCATION
              value: core
            - name: LG_TRUST_PROXY
              value: "1"
            - name: LG_DISABLED_PROTOCOLS
              value: route64_sg_v6
            - name: LG_PROBE_TARGETS
              value: 2606:4700:4700::1111,2001:4860:4860::8888
          ports:
            - name: looking-glass
              containerPort: 8080
              protocol: TCP
            - name: bird-metrics
              containerPort: 9003
          readinessProbe:
            httpGet:
              path: /health
              port: looking-glass
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: looking-glass
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: run
              mountPath: /run/bird
              readOnly: true
        - name: address-http
          image: ghcr.io/pmh-only/as218822-website:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: address-http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: address-website-config
              mountPath: /etc/nginx/nginx.conf
              subPath: http.conf
              readOnly: true
            - name: address-http-tmp
              mountPath: /tmp
        - name: address-https
          image: ghcr.io/pmh-only/as218822-website:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ceu
            - |
              until [ -s /etc/address-website-tls/tls.crt ] && [ -s /etc/address-website-tls/tls.key ]; do
                sleep 2
              done
              exec nginx -g 'daemon off;'
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: address-https
              containerPort: 443
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s /etc/address-website-tls/tls.crt && test -s /etc/address-website-tls/tls.key
            periodSeconds: 2
            failureThreshold: 300
          readinessProbe:
            exec:
              command:
                - nginx
                - -t
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - nginx
                - -t
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: address-website-config
              mountPath: /etc/nginx/nginx.conf
              subPath: https.conf
              readOnly: true
            - name: address-website-tls
              mountPath: /etc/address-website-tls
              readOnly: true
            - name: address-https-tmp
              mountPath: /tmp
        - name: exit-approval
          image: ghcr.io/pmh-only/as218822-looking-glass:latest
          command: ["node", "/etc/exit-approval/approve.mjs"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_id
            - name: TS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: exit-approval
              mountPath: /etc/exit-approval
              readOnly: true
            - name: exit-identity
              mountPath: /var/run/exit-identity
              readOnly: true
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TS_KUBE_SECRET
              value: $(POD_NAME)-tailscale
            - name: TS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_id
            - name: TS_CLIENT_SECRET_BASE
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
            - name: TS_CLIENT_SECRET
              value: $(TS_CLIENT_SECRET_BASE)?ephemeral=false&preauthorized=true
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: as218822-exit
            - name: TS_USERSPACE
              value: "false"
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --advertise-exit-node --advertise-tags=tag:as218822
            - name: TS_ENABLE_METRICS
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
          ports:
            - name: ts-metrics
              containerPort: 9002
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  state=$(tailscale status --json | sed -n '/^  "Self": {/,/^  },/p')
                  printf '%s\n' "$state" | grep -q '"Online": true'
                  printf '%s\n' "$state" | grep -q '"ExitNodeOption": true'
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: router-public-config
          configMap: {name: router-public-config}
        - name: address-website-config
          configMap:
            name: address-website
        - name: address-website-tls
          secret:
            secretName: address-website-tls
            optional: true
        - name: address-http-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: address-https-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: exit-identity
          secret:
            secretName: bird-0-tailscale
            optional: true
            items:
              - key: device_id
                path: device_id
              - key: device_ips
                path: device_ips
        - name: exit-approval
          configMap:
            name: exit-approval
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: zerotier-state
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
