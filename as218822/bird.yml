apiVersion: v1
kind: ServiceAccount
metadata:
  name: bird
  namespace: as218822
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bird
  namespace: as218822
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bird
  namespace: as218822
subjects:
  - kind: ServiceAccount
    name: bird
    namespace: as218822
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bird
---
apiVersion: v1
kind: Service
metadata:
  name: bird
  namespace: as218822
spec:
  clusterIP: None
  selector:
    app: bird
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bird
  namespace: as218822
spec:
  serviceName: bird
  replicas: 1
  selector:
    matchLabels:
      app: bird
  template:
    metadata:
      labels:
        app: bird
    spec:
      serviceAccountName: bird
      terminationGracePeriodSeconds: 30
      nodeSelector:
        infra.pmh.codes/bgp: enabled
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: bird-gre-gateway
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: network-config
          image: ghcr.io/tailscale/tailscale:latest
          command:
            - /bin/sh
            - -ceu
            - |
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv6.conf.all.forwarding=1
              ip -6 address replace 2a06:9801:ff0::/128 dev lo
          securityContext:
            privileged: true
      containers:
        - name: bird
          image: ghcr.io/pmh-only/as218822:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_BIND_SERVICE
                - NET_RAW
          env:
            - name: DOTENV_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bird-dotenvx
                  key: DOTENV_PRIVATE_KEY
            - name: WG_CORE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: as218822-router-wireguard
                  key: WG_CORE_PRIVATE_KEY
          startupProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: run
              mountPath: /run/bird
            - name: zerotier-state
              mountPath: /var/lib/zerotier-one
            - name: tun
              mountPath: /dev/net/tun
        - name: looking-glass
          image: ghcr.io/pmh-only/as218822-looking-glass:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          env:
            - name: LG_ALLOWED_ORIGINS
              value: https://as218822.net,https://www.as218822.net
            - name: LG_HOST
              value: 0.0.0.0
            - name: LG_LOCATION
              value: core
            - name: LG_TRUST_PROXY
              value: "1"
          ports:
            - name: looking-glass
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: looking-glass
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: looking-glass
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: run
              mountPath: /run/bird
              readOnly: true
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TS_KUBE_SECRET
              value: $(POD_NAME)-tailscale
            - name: TS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_id
            - name: TS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
            - name: TS_HOSTNAME
              value: as218822-exit
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --advertise-exit-node --advertise-tags=tag:k8s
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ceu
                  - |
                    until ip6tables-legacy -w -t nat -S ts-postrouting >/dev/null 2>&1; do
                      sleep 1
                    done
                    ip6tables-legacy -w -t nat -C POSTROUTING \
                      -m mark --mark 0x40000/0xff0000 \
                      -j SNAT --to-source 2a06:9801:ff0:: 2>/dev/null || \
                    ip6tables-legacy -w -t nat -I POSTROUTING 1 \
                      -m mark --mark 0x40000/0xff0000 \
                      -j SNAT --to-source 2a06:9801:ff0::
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    ip6tables-legacy -w -t nat -D POSTROUTING \
                      -m mark --mark 0x40000/0xff0000 \
                      -j SNAT --to-source 2a06:9801:ff0:: 2>/dev/null || true
                    ip -6 address del 2a06:9801:ff0::/128 dev lo 2>/dev/null || true
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: zerotier-state
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
