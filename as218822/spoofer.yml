# Keep completed Jobs for evidence. TTL deletion plus Argo self-heal would rerun tests.
# Sequence future runs by adding the next Job after the previous one completes,
# rather than suspending a Job that Argo CD is waiting to finish.
apiVersion: batch/v1
kind: Job
metadata:
  name: spoofer-segment-a-20260908-r3
  namespace: as218822
  annotations:
    as218822.net/caida-report: https://spoofer.caida.org/report.php?sessionid=2229220
    as218822.net/caida-baseline: https://spoofer.caida.org/report.php?sessionid=2229072
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: spoofer
        segment: a
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/hostname: pmhoci2
      containers:
        - name: spoofer
          # Explicit TLS port keeps this tag outside the router's image-name rewrite.
          image: ghcr.io:443/pmh-only/as218822:spoofer
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: SPOOFER_ADDRESS
              value: 2a06:9801:ff0:100::2
            - name: SPOOFER_PEERING_ADDRESS
              value: fd00:218:822:38::1/127
            - name: SPOOFER_ENDPOINT
              value: bird.as218822.svc.cluster.local:51830
            - name: SPOOFER_SERVER_PUBLIC_KEY
              value: guHhnQ4SzmkIn+RYBa+WW/sH1hggf6EcX5JX/rPTT2c=
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: wireguard
              mountPath: /run/wireguard
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: wireguard
          secret:
            secretName: spoofer-wireguard
            defaultMode: 0400
            items:
              - key: segment-a
                path: private.key
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
