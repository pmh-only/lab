apiVersion: v1
kind: Service
metadata:
  name: looking-glass
  namespace: as218822
spec:
  selector:
    app: bird
  ports:
    - name: http
      port: 8080
      targetPort: looking-glass
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: looking-glass
  namespace: as218822
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - lg.pmh.codes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: looking-glass
          port: 8080
          weight: 1
