apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripe-atlas
  namespace: as218822
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripe-atlas-ipv4
  namespace: as218822
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ripe-atlas-ipv4
  template:
    metadata:
      labels:
        app: ripe-atlas-ipv4
    spec:
      containers:
        - name: ripe-atlas
          image: ghcr.io/pmh-only/as218822-ripe-atlas:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - NET_RAW
                - SETGID
                - SETUID
          env:
            - name: RXTXRPT
              value: "yes"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - test
                - -s
                - /etc/ripe-atlas/probe_key.pub
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/usr/local/bin/atlas-healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ripe-atlas
            - name: run
              mountPath: /run/ripe-atlas
            - name: spool
              mountPath: /var/spool/ripe-atlas
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ripe-atlas
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: spool
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripe-atlas-as218822
  namespace: as218822
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ripe-atlas-as218822
  namespace: as218822
spec:
  clusterIP: None
  selector:
    app: ripe-atlas-as218822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripe-atlas-as218822
  namespace: as218822
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ripe-atlas-as218822
  template:
    metadata:
      labels:
        app: ripe-atlas-as218822
    spec:
      serviceAccountName: bird
      nodeSelector:
        infra.pmh.codes/bgp: enabled
      containers:
        - name: ripe-atlas
          image: ghcr.io/pmh-only/as218822-ripe-atlas:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - NET_RAW
                - SETGID
                - SETUID
          env:
            - name: RXTXRPT
              value: "yes"
            - name: SSH_ADDRESS_FAMILY
              value: inet
            - name: WAIT_FOR_INTERFACE
              value: tailscale0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - test
                - -s
                - /etc/ripe-atlas/probe_key.pub
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/usr/local/bin/atlas-healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ripe-atlas
            - name: run
              mountPath: /run/ripe-atlas
            - name: spool
              mountPath: /var/spool/ripe-atlas
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          env:
            - name: TS_KUBE_SECRET
              value: ripe-atlas-as218822-tailscale
            - name: TS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_id
            - name: TS_CLIENT_SECRET_BASE
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
            - name: TS_CLIENT_SECRET
              value: $(TS_CLIENT_SECRET_BASE)?ephemeral=false&preauthorized=true
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: ripe-atlas-as218822
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --exit-node=100.91.148.11 --exit-node-allow-lan-access --advertise-tags=tag:k8s
            - name: TS_ENABLE_METRICS
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
          ports:
            - name: ts-metrics
              containerPort: 9002
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  state=$(tailscale status --json)
                  printf '%s\n' "$state" | sed -n '/^  "Self": {/,/^  },/p' | grep -q '"Online": true'
                  printf '%s\n' "$state" | sed -n '/^  "ExitNodeStatus": {/,/^  },/p' | grep -q '"Online": true'
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ceu
                  - |
                    # Resolve the persisted exit selection again without reauth.
                    # Wait for administrative approval instead of restarting
                    # an otherwise healthy Tailscale daemon on an upstream fault.
                    until tailscale set --exit-node=100.91.148.11 --exit-node-allow-lan-access; do
                      sleep 10
                    done
                    attempts=0
                    until ip route show table 52 | grep -q '^default dev tailscale0'; do
                      attempts=$((attempts + 1))
                      [ "$attempts" -lt 120 ] || exit 1
                      sleep 1
                    done
                    until ip -6 route show table 52 | grep -q '^default dev tailscale0'; do
                      attempts=$((attempts + 1))
                      [ "$attempts" -lt 120 ] || exit 1
                      sleep 1
                    done
                    ip route replace throw 10.43.0.0/16 table 52
                    ip route replace throw 172.17.0.0/16 table 52
                    ip route replace 193.0.19.0/24 dev tailscale0 table 52
                    ip route replace 52.18.0.0/16 dev tailscale0 table 52
                    ip route replace unreachable default table 52
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ripe-atlas-as218822
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: spool
          emptyDir:
            sizeLimit: 100Mi
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
