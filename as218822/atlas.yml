apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripe-atlas
  namespace: as218822
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripe-atlas-ipv4
  namespace: as218822
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ripe-atlas-ipv4
  template:
    metadata:
      labels:
        app: ripe-atlas-ipv4
    spec:
      containers:
        - name: ripe-atlas
          image: ghcr.io/pmh-only/as218822-ripe-atlas:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - NET_RAW
                - SETGID
                - SETUID
          env:
            - name: RXTXRPT
              value: "yes"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - test
                - -s
                - /etc/ripe-atlas/probe_key.pub
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/usr/local/bin/atlas-healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ripe-atlas
            - name: run
              mountPath: /run/ripe-atlas
            - name: spool
              mountPath: /var/spool/ripe-atlas
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ripe-atlas
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: spool
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripe-atlas-as218822
  namespace: as218822
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ripe-atlas-as218822
  namespace: as218822
spec:
  clusterIP: None
  selector:
    app: ripe-atlas-as218822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripe-atlas-as218822
  namespace: as218822
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ripe-atlas-as218822
  template:
    metadata:
      labels:
        app: ripe-atlas-as218822
    spec:
      serviceAccountName: bird
      nodeSelector:
        infra.pmh.codes/bgp: enabled
      containers:
        - name: ripe-atlas
          image: ghcr.io/pmh-only/as218822-ripe-atlas:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - NET_RAW
                - SETGID
                - SETUID
          env:
            - name: RXTXRPT
              value: "yes"
            - name: SSH_ADDRESS_FAMILY
              value: inet
            - name: WAIT_FOR_INTERFACE
              value: tailscale0
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - test
                - -s
                - /etc/ripe-atlas/probe_key.pub
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["/usr/local/bin/atlas-healthcheck"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/ripe-atlas
            - name: run
              mountPath: /run/ripe-atlas
            - name: spool
              mountPath: /var/spool/ripe-atlas
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:latest
          command: ["/bin/sh", "/etc/atlas-routing/run.sh"]
          env:
            - name: TS_KUBE_SECRET
              value: ripe-atlas-as218822-tailscale
            - name: TS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_id
            - name: TS_CLIENT_SECRET_BASE
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
            - name: TS_CLIENT_SECRET
              value: $(TS_CLIENT_SECRET_BASE)?ephemeral=false&preauthorized=true
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              value: ripe-atlas-as218822
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:k8s
            - name: TS_ENABLE_METRICS
              value: "true"
            - name: TS_LOCAL_ADDR_PORT
              value: 0.0.0.0:9002
          ports:
            - name: ts-metrics
              containerPort: 9002
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  state=$(tailscale status --json)
                  printf '%s\n' "$state" | sed -n '/^  "Self": {/,/^  },/p' | grep -q '"Online": true'
                  printf '%s\n' "$state" | sed -n '/^  "ExitNodeStatus": {/,/^  },/p' | grep -q '"Online": true'
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: exit-identity
              mountPath: /var/run/exit-identity
              readOnly: true
            - name: atlas-routing
              mountPath: /etc/atlas-routing
              readOnly: true
      volumes:
        - name: exit-identity
          secret:
            secretName: bird-0-tailscale
            optional: true
            items:
              - key: device_id
                path: device_id
              - key: device_ips
                path: device_ips
        - name: atlas-routing
          configMap:
            name: atlas-routing
        - name: config
          persistentVolumeClaim:
            claimName: ripe-atlas-as218822
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: spool
          emptyDir:
            sizeLimit: 100Mi
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlas-routing
  namespace: as218822
data:
  run.sh: |
    #!/bin/sh
    set -eu
    /usr/local/bin/containerboot &
    pid=$!
    trap 'kill -TERM "$pid" 2>/dev/null || true; wait "$pid" || true; exit 0' TERM INT
    configured=
    while kill -0 "$pid" 2>/dev/null; do
      id=$(cat /var/run/exit-identity/device_id 2>/dev/null || true)
      exit_ip=$(tr '",[] ' '\n' < /var/run/exit-identity/device_ips | grep -E '^100\.[0-9]+\.[0-9]+\.[0-9]+$' || true)
      if [ -n "$id" ] && [ -n "$exit_ip" ] && [ "$configured" != "$id:$exit_ip" ] &&
          tailscale status --json 2>/dev/null | sed -n '/^  "Self": {/,/^  },/p' | grep -q '"Online": true'; then
        if tailscale set --exit-node="$exit_ip" --exit-node-allow-lan-access; then
          # Keep service/pod return traffic on the underlay and leave table 52
          # entirely under Tailscale's control, including during reconnection.
          ip rule show | grep -q '^5255:' || ip rule add pref 5255 to 172.17.0.0/16 lookup main
          ip rule show | grep -q '^5256:' || ip rule add pref 5256 to 172.16.0.0/16 lookup main
          ip route replace 193.0.19.0/24 dev tailscale0 table 218822
          ip route replace 52.18.0.0/16 dev tailscale0 table 218822
          ip route replace 100.100.100.100/32 dev tailscale0 table 218822
          ip route replace unreachable default table 218822
          ip rule show | grep -q '^5260:' || ip rule add pref 5260 lookup 218822
          configured="$id:$exit_ip"
        fi
      fi
      sleep 10 &
      wait $! || true
    done
    wait "$pid"
