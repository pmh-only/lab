apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bird-gre-gateway
  namespace: as218822
spec:
  serviceName: bird-gre-gateway
  replicas: 1
  selector:
    matchLabels:
      app: bird-gre-gateway
  template:
    metadata:
      labels:
        app: bird-gre-gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      nodeSelector:
        infra.pmh.codes/bgp: enabled
      initContainers:
        - name: forwarding
          image: ghcr.io/tailscale/tailscale:latest
          command:
            - /bin/sh
            - -ceu
            - |
              sysctl -w net.ipv6.conf.all.forwarding=1
          securityContext:
            privileged: true
      containers:
        - name: bird
          image: ghcr.io/pmh-only/as218822-gre-gateway:latest
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_BIND_SERVICE
                - NET_RAW
          env:
            - name: WG_GRE_GATEWAY_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: as218822-router-wireguard
                  key: WG_GRE_GATEWAY_PRIVATE_KEY
            - name: WG_LUNALIGHT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: as218822-router-wireguard
                  key: WG_LUNALIGHT_PRIVATE_KEY
            - name: WG_LUNALIGHT_PRESHARED_KEY
              valueFrom:
                secretKeyRef:
                  name: as218822-router-wireguard
                  key: WG_LUNALIGHT_PRESHARED_KEY
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - birdc
                - -s
                - /run/bird/bird.ctl
                - show
                - status
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          volumeMounts:
            - name: run
              mountPath: /run/bird
        - name: monitoring
          image: ghcr.io/pmh-only/as218822-looking-glass:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 0
            capabilities:
              drop: ["ALL"]
          env:
            - name: LG_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LG_PORT
              value: "18080"
            - name: LG_METRICS_PORT
              value: "19003"
            - name: LG_LOCATION
              value: gre-gateway
            - name: LG_ENABLE_QUERIES
              value: "0"
          ports:
            - name: bird-metrics
              containerPort: 19003
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /live
              port: 18080
            periodSeconds: 30
          volumeMounts:
            - name: run
              mountPath: /run/bird
              readOnly: true
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
