apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: as218822
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/pmh-only/as218822-console:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: CONSOLE_PORT
              value: "8080"
            - name: PROMETHEUS_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090
            - name: OIDC_ISSUER_URL
              value: https://auth.pmh.codes/application/o/as218822/
            - name: OIDC_CLIENT_ID
              value: 8pIztfBRh51wufpeGKJysw4vUDhLbywjns3RwE4t
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URI
              value: https://bgp.pmh.codes/auth/callback
            - name: OIDC_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: console-oidc
                  key: OIDC_SESSION_SECRET
            - name: OIDC_ALLOW_ANY_AUTHENTICATED
              value: "true"
            - name: OIDC_SCOPES
              value: openid profile email
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: as218822
spec:
  selector:
    app: console
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: as218822
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - bgp.pmh.codes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: console
          port: 8080
          weight: 1
