apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: address-website
  namespace: as218822
spec:
  secretName: address-website-tls
  duration: 160h
  renewBeforePercentage: 33
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - as218822.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
