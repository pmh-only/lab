apiVersion: v1
kind: ServiceAccount
metadata:
  name: bro
  namespace: bro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bro-readonly
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
  - apiGroups:
      - apps
      - batch
      - autoscaling
      - networking.k8s.io
      - policy
      - storage.k8s.io
      - rbac.authorization.k8s.io
      - apiextensions.k8s.io
      - admissionregistration.k8s.io
      - events.k8s.io
      - discovery.k8s.io
      - scheduling.k8s.io
      - node.k8s.io
      - coordination.k8s.io
      - certificates.k8s.io
      - flowcontrol.apiserver.k8s.io
      - metrics.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bro-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bro-readonly
subjects:
  - kind: ServiceAccount
    name: bro
    namespace: bro
