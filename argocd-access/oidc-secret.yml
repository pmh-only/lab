apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: argocd-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd
    serviceAccount: vault-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: argocd-oidc
  mount: secret
  type: kv-v2
  path: argocd/oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: argocd-oidc
    type: Opaque
    labels:
      app.kubernetes.io/part-of: argocd
