apiVersion: v1
kind: ServiceAccount
metadata:
  name: notifications-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: argocd-notifications
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: argocd-notifications
    serviceAccount: notifications-vault-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-notifications
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: argocd-notifications
  mount: secret
  type: kv-v2
  path: argocd/notifications-github
  refreshAfter: 1m
  destination:
    create: true
    # Adopt the empty Secret supplied by the upstream Argo CD installation.
    overwrite: true
    name: argocd-notifications-secret
    type: Opaque
    labels:
      app.kubernetes.io/part-of: argocd
