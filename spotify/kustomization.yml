apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spotify
resources:
  - ./secret.yml
  - ./pvc.yml
  - ./deployment.yml
  - ./service.yml
  # Native migrations, empty-history and OAuth/state checks verified privately.
  - ./ingress.yml
configMapGenerator:
  - name: spotify-native-bootstrap
    files: [prepare-api.mjs]
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        strategy:
          type: Recreate
images:
  - name: ghcr.io/yooooomi/your_spotify_server
    newTag: latest
    digest: sha256:624ea009f2ef9d877989bee9c7913ac66840449f566517871696c31a8ea13ddf
  - name: ghcr.io/pmh-only/playstats
    newTag: latest
    digest: sha256:d3f8c81fa8e4eb5649f65377418882997b8974a45762ff0704309901f70b4968
