apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spotify
resources:
  - ./secret.yml
  - ./pvc.yml
  - ./deployment.yml
  - ./service.yml
  # Native migrations, empty-history and OAuth/state checks verified privately.
  - ./ingress.yml
patches:
