apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spotify
resources:
  - ./secret.yml
  - ./pvc.yml
  - ./deployment.yml
  - ./service.yml
  # Native migrations, empty-history and OAuth/state checks verified privately.
  - ./ingress.yml
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        strategy:
          type: Recreate
images:
  - name: ghcr.io/yooooomi/your_spotify_server
    newName: ghcr.io/pmh-only/lab-spotify
    newTag: latest
    digest: sha256:aa8c0d619b37f4196bf807d1a1a1b529b6038d6b9aab4bf1b5091bf44823f85f
  - name: ghcr.io/pmh-only/playstats
    newTag: latest
    digest: sha256:d3f8c81fa8e4eb5649f65377418882997b8974a45762ff0704309901f70b4968
