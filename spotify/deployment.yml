apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-api
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: spotify-api
  template:
    metadata:
      labels:
        app: spotify-api
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-native-api
          image: ghcr.io/yooooomi/your_spotify_server:latest
          command: [node, /bootstrap/prepare-api.mjs]
          volumeMounts:
            - name: native-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: prepared-api
              mountPath: /prepared
      containers:
        - name: spotify-api
          image: ghcr.io/yooooomi/your_spotify_server:latest
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
          env:
            - name: MONGO_NO_ADMIN_RIGHTS
              value: "true"
            # Native info-level startup logs include the database URI.
            - name: LOG_LEVEL
              value: warn
            - name: CLIENT_ENDPOINT
              value: https://spotify.pmh.codes
            - name: API_ENDPOINT
              value: https://spotify.pmh.codes/api
            - name: SPOTIFY_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: SPOTIFY_PUBLIC
            - name: SPOTIFY_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: SPOTIFY_SECRET
            - name: TIMEZONE
              value: Asia/Seoul
            - name: MONGO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: MONGO_ENDPOINT
          volumeMounts:
            - name: prepared-api
              mountPath: /app/apps/server/build/index.js
              subPath: index.js
              readOnly: true
            - mountPath: /home/node
              name: spotify-pvc
      volumes:
        - name: native-bootstrap
          configMap:
            name: spotify-native-bootstrap
        - name: prepared-api
          emptyDir: {}
        - name: spotify-pvc
          persistentVolumeClaim:
            claimName: spotify-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-web
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: spotify-web
  template:
    metadata:
      labels:
        app: spotify-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: spotify-api
          image: ghcr.io/pmh-only/playstats:latest
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: CLIENT_ENDPOINT
              value: https://spotify.pmh.codes
            - name: API_ENDPOINT
              value: https://spotify.pmh.codes/api
            - name: SPOTIFY_PUBLIC
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: SPOTIFY_PUBLIC
            - name: SPOTIFY_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: SPOTIFY_SECRET
            - name: TIMEZONE
              value: Asia/Seoul
            - name: MONGO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: MONGO_ENDPOINT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-stats-worker
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: spotify-stats-worker
  template:
    metadata:
      labels:
        app: spotify-stats-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: stats-worker
          image: ghcr.io/pmh-only/playstats:latest
          command: ["node", "./dist/worker.mjs"]
          env:
            - name: TIMEZONE
              value: Asia/Seoul
            - name: STATS_REFRESH_INTERVAL_MS
              value: "900000"
            - name: MONGO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: MONGO_ENDPOINT
