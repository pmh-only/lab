---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: spotify-secret
  namespace: spotify
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: spotify/spotify-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: spotify-secret
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: spotify-api
    - kind: Deployment
      name: spotify-web
    - kind: Deployment
      name: spotify-stats-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: spotify
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: spotify
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: spotify
    serviceAccount: vault-auth
    audiences:
    - vault
