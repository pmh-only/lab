apiVersion: v1
kind: ServiceAccount
metadata:
  name: address-certificate-rollout
  namespace: as218822
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: address-certificate-rollout
  namespace: as218822
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: address-certificate-rollout
  namespace: as218822
subjects:
  - kind: ServiceAccount
    name: address-certificate-rollout
    namespace: as218822
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: address-certificate-rollout
---
apiVersion: batch/v1
kind: Job
metadata:
  name: address-certificate-rollout-v2
  namespace: as218822
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: address-certificate-rollout
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: alpine/k8s:1.36.0
          command:
            - /bin/sh
            - -ceu
            - |
              kubectl get secret address-website-tls -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/tls.crt
              kubectl get secret address-website-tls -o jsonpath='{.data.tls\.key}' | base64 -d > /tmp/tls.key
              kubectl create secret tls address-website-tls-v3 \
                --cert=/tmp/tls.crt \
                --key=/tmp/tls.key \
                --dry-run=client \
                -o yaml | kubectl apply -f -
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
