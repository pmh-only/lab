apiVersion: v1
kind: ServiceAccount
metadata:
  name: address-certificate-cleanup
  namespace: as218822
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: address-certificate-cleanup
  namespace: as218822
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - address-website-tls-v2
      - address-website-tls-v3
    verbs:
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: address-certificate-cleanup
  namespace: as218822
subjects:
  - kind: ServiceAccount
    name: address-certificate-cleanup
    namespace: as218822
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: address-certificate-cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: address-certificate-cleanup
  namespace: as218822
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: address-certificate-cleanup
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: alpine/k8s:1.36.0
          command:
            - kubectl
            - delete
            - secret
            - address-website-tls-v2
            - address-website-tls-v3
            - --ignore-not-found
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
