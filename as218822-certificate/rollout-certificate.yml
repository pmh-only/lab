apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: address-website-rollout
  namespace: as218822
spec:
  secretName: address-website-tls-v3
  duration: 160h
  renewBeforePercentage: 33
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  ipAddresses:
    - "2a06:9801:ff0::"
  dnsNames:
    - as218822.net
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
