apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nameserver-secondary-admin
  namespace: nameserver
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  # Native clustering synchronizes administration from the Primary node.
  path: nameserver/nameserver-admin
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: nameserver-secondary-admin
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nameserver-secondary-tls-keystore
  namespace: nameserver
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: nameserver/nameserver-secondary-tls-keystore
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: nameserver-secondary-tls-keystore
    type: Opaque
