apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nameserver-secondary-admin
  namespace: nameserver
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: nameserver/nameserver-secondary-admin
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: nameserver-secondary-admin
    type: Opaque
---
