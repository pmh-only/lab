apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nameserver-admin
  namespace: nameserver
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: nameserver/nameserver-admin
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: nameserver-admin
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nameserver-tls-keystore
  namespace: nameserver
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: nameserver/nameserver-tls-keystore
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: nameserver-tls-keystore
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: nameserver
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: nameserver
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: nameserver
    serviceAccount: vault-auth
    audiences:
    - vault
