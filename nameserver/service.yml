apiVersion: v1
kind: Service
metadata:
  name: nameserver
spec:
  clusterIP: 172.17.0.20
  selector:
    app: nameserver
  # The bootstrap primary runs on one node; clients on both nodes must reach it.
  internalTrafficPolicy: Cluster
  ports:
    - name: webconsole
      protocol: TCP
      port: 5380
      targetPort: 5380

    - name: webconsole-tls
      protocol: TCP
      port: 53443
      targetPort: 53443

    - name: dns
      protocol: UDP
      port: 53
      targetPort: 53

    - name: dnstcp
      protocol: TCP
      port: 53
      targetPort: 53

    - name: doh
      protocol: TCP
      port: 80
