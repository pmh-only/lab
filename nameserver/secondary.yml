apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nameserver-secondary
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: nameserver-secondary
  template:
    metadata:
      labels:
        app: nameserver-secondary
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 172.17.0.20
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: NotIn
                values:
                  - 'true'
      securityContext:
        sysctls:
          - name: net.ipv4.ip_local_port_range
            value: "1024 65535"
      containers:
        - name: nameserver
          image: ghcr.io/pmh-only/technitium:latest
          ports:
          - containerPort: 53443
            hostPort: 53443
            protocol: TCP
          volumeMounts:
            - name: nameserver
              mountPath: /etc/dns
      volumes:
        - name: nameserver
          hostPath:
            path: /etc/dns
