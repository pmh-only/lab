apiVersion: batch/v1
kind: Job
metadata:
  name: nameserver-configure
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nameserver-configure
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: configure
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          command: ["python", "/configuration/configure.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: configuration
              mountPath: /configuration
              readOnly: true
            - name: admin
              mountPath: /run/secrets/nameserver-admin
              readOnly: true
            - name: ca
              mountPath: /run/secrets/nameserver-ca
              readOnly: true
            - name: secondary-admin
              mountPath: /run/secrets/secondary-admin
              readOnly: true
            - name: secondary-ca
              mountPath: /run/secrets/secondary-ca
              readOnly: true
            - name: zone-transfer
              mountPath: /run/secrets/zone-transfer
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: nameserver-configuration
        - name: admin
          secret:
            secretName: nameserver-admin
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: ca
          secret:
            secretName: nameserver-tls-secret
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
        - name: secondary-admin
          secret:
            secretName: nameserver-secondary-admin
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: secondary-ca
          secret:
            secretName: nameserver-secondary-tls-secret
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
        - name: zone-transfer
          secret:
            secretName: nameserver-zone-transfer
            defaultMode: 0440
            items:
              - key: key
                path: key
