apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nameserver-tls-secret
  namespace: nameserver
spec:
  commonName: ns1.pmh.codes
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - "ns1.pmh.codes"
    - "ns2.pmh.codes"
    - "ns3.pmh.codes"
    - nameserver.nameserver.svc.cluster.local
    - localhost
  ipAddresses:
    - "127.0.0.1"
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: nameserver-bootstrap
  secretName: nameserver-tls-secret
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: nameserver-tls-keystore
        key: password
      profile: Modern2023
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - key encipherment
