apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nameserver
resources:
  - ./secret.yml
  - ./secondary-secrets.yml
  - ./deployment.yml
  - ./pvc.yml
  - ./service.yml
  - ./ingress.yml
  - ./certificate.yml
  - ./bootstrap-issuer.yml
  - ./configure-job.yml
  - ./secondary.yml
  - ./tertiary.yml
configMapGenerator:
  - name: nameserver-configuration
    files:
      - configuration/configure.py
      - configuration/settings.json
      - configuration/dns01.json
      - configuration/authoritative.json
      - configuration/zones.json
      - configuration/zonefiles.py
      - zones/pmh.codes.zone
      - zones/pmh.so.zone
      - zones/not.ai.kr.zone
      - zones/as218822.net.zone
      - configuration/records.py
      - configuration/ech.json
images:
  - name: ghcr.io/pmh-only/lab-nameserver
    newTag: latest
    digest: sha256:d276f80093517202b1a0bb8e4ac48d607626ed12803bb6bfd25d017eded9db2f
  - name: ghcr.io/pmh-only/technitium
    newTag: latest
    digest: sha256:00cea6a251adfef4f7cb10d6b7c8bd16c7701e28f23dd01430da0f9b7c6f2e46
