apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nameserver
resources:
  - ./deployment.yml
  - ./pvc.yml
  - ./service.yml
  - ./ingress.yml
  - ./certificate.yml
  - ./bootstrap-issuer.yml
  - ./networkpolicy.yml
  - ./configure-job.yml
  - ./secondary.yml
configMapGenerator:
  - name: nameserver-configuration
    files:
      - configuration/configure.py
      - configuration/settings.json
      - configuration/dns01.json
      - configuration/authoritative.json
      - configuration/replication.json
      - configuration/replication.py
# Vault authentication and Secret synchronization are owned by nameserver-secrets.
images:
  - name: ghcr.io/pmh-only/technitium
    newTag: latest
    digest: sha256:43ef30d69718e6b7e81c3d25d74b71527ce28e6e0e4257e0c2f3c4d7a58af20a
