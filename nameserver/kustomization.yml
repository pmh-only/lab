apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nameserver
resources:
  - ./deployment.yml
  - ./pvc.yml
  - ./service.yml
  - ./ingress.yml
  - ./certificate.yml
  - ./bootstrap-issuer.yml
  - ./configure-job.yml
  - ./secondary.yml
  - ./tertiary.yml
configMapGenerator:
  - name: nameserver-configuration
    files:
      - configuration/configure.py
      - configuration/settings.json
      - configuration/dns01.json
      - configuration/authoritative.json
      - configuration/imported-records.json
      - configuration/records.py
# Vault authentication and Secret synchronization are owned by nameserver-secrets.
images:
  - name: ghcr.io/pmh-only/technitium
    newTag: latest
    digest: sha256:00cea6a251adfef4f7cb10d6b7c8bd16c7701e28f23dd01430da0f9b7c6f2e46
