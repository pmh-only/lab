apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nameserver-ingress
spec:
  podSelector:
    matchLabels:
      app: nameserver
  policyTypes:
    - Ingress
  ingress:
    # Cluster workloads may use the private recursive DNS service.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Only the main Envoy data plane may reach HTTP/DoH backends directly.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: main
              gateway.envoyproxy.io/owning-gateway-namespace: gateway
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5380
    # The DNS01 webhook will authenticate to the private management API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cert-manager
      ports:
        - protocol: TCP
          port: 5380
    # GitOps configuration uses verified HTTPS, not the cleartext API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nameserver-configure
      ports:
        - protocol: TCP
          port: 53443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nameserver-secondary-ingress
spec:
  podSelector:
    matchLabels:
      app: nameserver-secondary
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nameserver-configure
      ports:
        - protocol: TCP
          port: 53443
