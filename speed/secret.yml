---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: speed-secret
  namespace: speed
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: speed/speed-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: speed-secret
    type: Opaque
    labels:
      app.kubernetes.io/instance: speed
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: speed
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: speed
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: speed
    serviceAccount: vault-auth
    audiences:
    - vault
