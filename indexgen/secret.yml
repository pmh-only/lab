---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: indexgen-secrets
  namespace: indexgen
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: indexgen/indexgen-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: indexgen-secrets
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: indexgen
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: indexgen
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: indexgen
    serviceAccount: vault-auth
    audiences:
    - vault
