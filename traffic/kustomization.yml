apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traffic
resources:
  - ./aggregator_cm.yml
  - ./aggregator_svc.yml
  - ./aggregator.yml
  - ./collector_cm.yml
  - ./collector.yml
  # Real Gateway log privacy, native dashboard and /ws handshake verified.
  - ./ingress.yml
configMapGenerator:
  - name: traffic-preparation
    files:
      - prepare-logs.sh
      - redact.lua
      - backfill.conf
