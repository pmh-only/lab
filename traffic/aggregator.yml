apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: traffic
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: prepare-report-logs
          image: ghcr.io/pmh-only/busybox:latest
          command: [/bin/sh, /bootstrap/prepare-logs.sh]
          volumeMounts:
            - name: preparation
              mountPath: /bootstrap
              readOnly: true
            - name: ds-logs
              mountPath: /logs
        - name: native-report-backfill
          image: cr.fluentbit.io/fluent/fluent-bit:latest
          command: [/fluent-bit/bin/fluent-bit]
          args: [-c, /bootstrap/backfill.conf]
          volumeMounts:
            - name: preparation
              mountPath: /bootstrap
              readOnly: true
            - name: ds-logs
              mountPath: /logs
      containers:
        - name: goaccess
          image: ghcr.io/pmh-only/lab-goaccess:latest
          args:
            - -p
            - /etc/conf/goaccess.conf
            - /logs/all.safe.log
          volumeMounts:
            - name: ds-logs
              mountPath: /logs
            - name: ds-render
              mountPath: /render
            - name: fb-conf
              mountPath: /etc/conf/
          ports:
            - name: ws
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: ws

        - name: servehtml
          image: ghcr.io/pmh-only/busybox:latest
          command:
            - httpd
            - -f
            - -h
            - /render
          volumeMounts:
            - name: ds-render
              mountPath: /render
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http

        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:latest
          ports:
            - containerPort: 24224
              name: forward
          readinessProbe:
            tcpSocket:
              port: forward
          volumeMounts:
            - name: preparation
              mountPath: /bootstrap
              readOnly: true
            - name: ds-logs
              mountPath: /logs
            - name: fb-conf
              mountPath: /fluent-bit/etc/
          env:
            - name: FLUENT_BIT_CONFIG
              value: /fluent-bit/etc/fluent-bit.conf

      volumes:
        - name: preparation
          configMap:
            name: traffic-preparation
        - name: ds-logs
          hostPath:
            path: /mnt/data/logs
            type: DirectoryOrCreate
        - name: fb-conf
          configMap:
            name: aggregator-conf
        - name: ds-render
          emptyDir: {}
