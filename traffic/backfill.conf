[SERVICE]
  Flush      1
  Grace      5
  Log_Level  warn

[INPUT]
  Name            tail
  Tag             ds.safe
  Path            /logs/all.log
  Read_From_Head  On
  Exit_On_Eof     On
  Skip_Long_Lines On
  Mem_Buf_Limit   50MB

[FILTER]
  Name   lua
  Match  ds.safe
  script /bootstrap/redact.lua
  call   redact_auth

[OUTPUT]
  Name      file
  Match     ds.safe
  Path      /logs
  File      all.safe.log
  Format    template
  Template  {log}
