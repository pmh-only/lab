apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codexlb
resources:
  - ./deployment.yml
  - ./service.yml
  - ./pvc.yml
  - ./secret.yml
  - ./initialize-job.yml
  # Publish only after native dashboard password initialization and verification.
configMapGenerator:
