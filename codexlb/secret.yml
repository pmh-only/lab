apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: codexlb-bootstrap
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: codexlb/bootstrap-login
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: codexlb-bootstrap
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: codexlb
    serviceAccount: vault-auth
    audiences: [vault]
