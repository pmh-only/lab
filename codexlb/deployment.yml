apiVersion: apps/v1
kind: Deployment
metadata:
  name: codexlb
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: codexlb
  template:
    metadata:
      labels:
        app: codexlb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: codexlb
          image: ghcr.io/aafqaq/codex-lb-enhanced:latest
          ports:
            - containerPort: 2455
          startupProbe:
            tcpSocket:
              port: 2455
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 2455
          env:
            - name: CODEX_LB_DASHBOARD_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codexlb-bootstrap
                  key: BOOTSTRAP_TOKEN
            - name: CODEX_LB_HTTP_RESPONSES_SESSION_BRIDGE_AMBIGUOUS_CONTINUATION_RECOVERY_MODE
              value: server_indefinite_recovery
            - name: CODEX_LB_DATA_DIR
              value: /var/lib/codex-lb
          volumeMounts:
            - mountPath: /var/lib/codex-lb
              name: codexlb-pvc
      volumes:
        - name: codexlb-pvc
          persistentVolumeClaim:
            claimName: codexlb-pvc
