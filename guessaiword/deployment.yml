apiVersion: apps/v1
kind: Deployment
metadata:
  name: guessaiword
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: guessaiword
  template:
    metadata:
      labels:
        app: guessaiword
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: guessaiword
          image: ghcr.io/pmh-only/guess-ai-word:latest
          env:
            - name: SPRING_CONFIG_LOCATION
              value: file:/app/config/application.properties
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx512m
          startupProbe:
            httpGet:
              path: /
              port: 8080
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: guessaiword-secret
              mountPath: "/app/config"
              readOnly: true
            - name: game-data
              mountPath: /var/lib/guessaiword
      volumes:
        - name: guessaiword-secret
          secret:
            secretName: guessaiword-secret
            defaultMode: 0440
            items:
              - key: application.properties
                path: application.properties
        - name: game-data
          persistentVolumeClaim:
            claimName: guessaiword-data
