---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: guessaiword-secret
  namespace: guessaiword
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: guessaiword/guessaiword-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: guessaiword-secret
    type: Opaque
    labels:
      app.kubernetes.io/instance: guessaiword
  rolloutRestartTargets:
    - kind: Deployment
      name: guessaiword
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: guessaiword
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: guessaiword
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: guessaiword
    serviceAccount: vault-auth
    audiences:
    - vault
