apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guessaiword-route
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - guess.pmh.codes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: guessaiword-service
          port: 8080
          weight: 1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: guessaiword-secure-game-cookie
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: guessaiword-route
  lua:
    - type: Inline
      inline: |
        function envoy_on_response(response_handle)
          local headers = response_handle:headers()
          local cookies = {}
          for name, value in pairs(headers) do
            if name == "set-cookie" then
              if value:match("^GAME_TOKEN=") and not value:lower():match(";%s*secure") then
                value = value .. "; Secure"
              end
              table.insert(cookies, value)
            end
          end
          if #cookies > 0 then
            headers:remove("set-cookie")
            for _, value in ipairs(cookies) do
              headers:add("set-cookie", value)
            end
          end
        end
