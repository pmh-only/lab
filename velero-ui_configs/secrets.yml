apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: velero-ui-secrets
  namespace: velero
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: velero/velero-ui-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: velero-ui-secrets
    type: Opaque
