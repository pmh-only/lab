apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: otp-inbox
  namespace: otp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: otp/otp-inbox
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: otp-inbox
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: otp-inbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: otp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: otp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: otp
    serviceAccount: vault-auth
    audiences:
    - vault
