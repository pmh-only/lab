apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - ./pvc.yml
  - ./deployment.yml
  - ./secret.yml
  - ./service.yml
  # Publish the route only after the fresh administrator has been verified.
  - ./network-policy.yml
configMapGenerator:
  - name: authentik-runtime
    literals:
      - AUTHENTIK_POSTGRESQL__HOST=pgsql-service.database.svc.cluster.local
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_STORAGE__FILE__PATH=/data
      - AUTHENTIK_WEB__BASE_URL=https://auth.pmh.codes
      - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=172.16.0.0/24,172.16.1.0/24
      - AUTHENTIK_OUTPOSTS__DISCOVER=false
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
images:
  - name: ghcr.io/goauthentik/server
    newTag: 2026.8.4
    digest: sha256:e7226ae116dac5aa0a5643803e735b010038f492c401e08e16b3bf1ac54c090c
