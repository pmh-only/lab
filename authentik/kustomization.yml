apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - ./pvc.yml
  - ./deployment.yml
  - ./secret.yml
  - ./service.yml
  # Fresh administrator password and API identity verified before publication.
  - ./ingress.yml
  - ./network-policy.yml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - discord.yaml=./blueprints/discord.yaml
      - discord-application-access.yaml=./blueprints/discord-application-access.yaml
      - as218822-user-access.yaml=./blueprints/as218822-user-access.yaml
      - seafile-discord-quota.yaml=./blueprints/seafile-discord-quota.yaml
  - name: authentik-runtime
    literals:
      - AUTHENTIK_POSTGRESQL__HOST=pgsql-service.database.svc.cluster.local
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_STORAGE__FILE__PATH=/data
      - AUTHENTIK_WEB__BASE_URL=https://auth.pmh.codes
      - AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS=172.16.0.0/24,172.16.1.0/24,172.16.2.0/24
      - AUTHENTIK_OUTPOSTS__DISCOVER=false
      - AUTHENTIK_DISABLE_STARTUP_ANALYTICS=true
images:
  - name: ghcr.io/goauthentik/server
    newTag: 2026.8.5
