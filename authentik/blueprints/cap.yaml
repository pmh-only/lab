version: 1
metadata:
  name: Lab - Cap CAPTCHA
entries:
  - model: authentik_stages_captcha.captchastage
    id: cap-captcha
    identifiers:
      name: cap-captcha
    attrs:
      public_key: !Env AUTHENTIK_CAP_ENDPOINT
      private_key: !Env AUTHENTIK_CAP_SECRET_KEY
      interactive: true
      js_url: https://auth.pmh.codes/static/dist/custom-cap-widget.js?v=3
      api_url: !Env AUTHENTIK_CAP_VERIFY_URL
      request_content_type: application/json

  # Identification verifies its embedded CAPTCHA before checking the password.
  # Cap tokens are single-use, so a failed password consumes the solved CAPTCHA.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields: [email, username]
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      captcha_stage: !KeyOf cap-captcha

  # Remove standalone steps: neither may run a second time after embedding.
  - model: authentik_flows.flowstagebinding
    state: absent
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf cap-captcha
  - model: authentik_flows.flowstagebinding
    state: absent
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]

  # Clear the entire plan on failure. Do not keep an authenticated password or
  # a previously solved CAPTCHA when retrying either credentials or MFA.
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
    attrs:
      invalid_response_action: restart
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
    attrs:
      invalid_response_action: restart
