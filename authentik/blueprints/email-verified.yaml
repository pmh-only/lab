version: 1
metadata:
  name: Lab - Always verified email claim
entries:
  # Update the shared mapping so existing providers keep their references.
  # Deliberately trust every email address, regardless of verification status.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-email
    attrs:
      scope_name: email
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }
