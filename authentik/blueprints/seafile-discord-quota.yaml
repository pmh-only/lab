version: 1
metadata:
  name: Lab - Seafile Discord quota role
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: seafile-quota-role
    identifiers:
      name: "lab bootstrap: seafile Discord quota role"
    attrs:
      scope_name: seafile
      expression: |
        is_discord = user.sources.filter(slug="discord").exists() or user.all_groups().filter(name="discord").exists()
        return {"seafile_role": "discord_10gb"} if is_discord else {}
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: "lab bootstrap: seafile"
    attrs:
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf seafile-quota-role
