apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
        app.kubernetes.io/component: server
        app.kubernetes.io/name: authentik
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: pmhoci2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: storage-directories
          image: ghcr.io/goauthentik/server:latest
          command: [/bin/sh, -ec, "mkdir -p /storage/data /storage/templates /storage/certs"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: authentik-storage
              mountPath: /storage
      containers:
        - name: authentik
          image: ghcr.io/goauthentik/server:latest
          args:
            - server
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: authentik-runtime
            - secretRef:
                name: authentik-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
          volumeMounts:
            - mountPath: /data
              name: authentik-storage
              subPath: data
            - mountPath: /templates
              name: authentik-storage
              subPath: templates
      volumes:
        - name: authentik-storage
          persistentVolumeClaim:
            claimName: authentik-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: pmhoci2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: storage-directories
          image: ghcr.io/goauthentik/server:latest
          command: [/bin/sh, -ec, "mkdir -p /storage/data /storage/templates /storage/certs"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: authentik-storage
              mountPath: /storage
      containers:
        - name: authentik
          image: ghcr.io/goauthentik/server:latest
          args:
            - worker
          envFrom:
            - configMapRef:
                name: authentik-runtime
            - secretRef:
                name: authentik-secrets
            - secretRef:
                name: authentik-bootstrap-worker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            exec:
              command: [ak, healthcheck]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [ak, healthcheck]
            periodSeconds: 15
          livenessProbe:
            exec:
              command: [ak, healthcheck]
            periodSeconds: 30
          volumeMounts:
            - mountPath: /data
              name: authentik-storage
              subPath: data
            - mountPath: /templates
              name: authentik-storage
              subPath: templates
            - mountPath: /certs
              name: authentik-storage
              subPath: certs
      volumes:
        - name: authentik-storage
          persistentVolumeClaim:
            claimName: authentik-pvc
