apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - podSelector:
            matchLabels:
              app: authentik-worker
      ports:
        - port: 9000
          protocol: TCP
