---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: authentik/authentik-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: authentik-secrets
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-bootstrap-worker
  namespace: authentik
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: authentik/bootstrap-worker
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: authentik-bootstrap-worker
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authentik-discord-oauth
  namespace: authentik
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: authentik/discord-oauth
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: authentik-discord-oauth
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: authentik-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: authentik
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: authentik
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: authentik
    serviceAccount: vault-auth
    audiences:
    - vault
