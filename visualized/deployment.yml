apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualized
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: visualized
  template:
    metadata:
      labels:
        app: visualized
    spec:
      serviceAccountName: visualized
      containers:
        - name: visualized
          image: ghcr.io/pmh-only/kube-universe:latest
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
