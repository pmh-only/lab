apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup-auth
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-backup
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-backup-s3
    serviceAccount: vault-backup-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vault-backup-s3
spec:
  vaultAuthRef: vault-backup
  mount: secret
  type: kv-v2
  path: vault/snapshot-s3
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: vault-backup-s3
    type: Opaque
