apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile
resources:
  - ./deployment.yml
  - ./service.yml
  # Native admin/OAuth/file I/O and SeaDoc/notification dependencies verified.
  - ./ingress.yml
  - ./secret.yml
  - ./dependencies.yml
configMapGenerator:
  - name: seafile-integration
    files:
      - initialize.py
      - seahub_lab.py
      - seahub_custom_functions.py
      - seahub_discord_quota.py
      - theme.css=./branding/theme.css
      - logo.svg=./branding/logo.svg
      - icon.svg=./branding/icon.svg
      - native-schema.json
images:
  - name: ghcr.io/pmh-only/lab-seafile
    newTag: latest
    digest: sha256:bc268dc2f14037c8ca798ae049a1ebb029fc146060e73a2e7ea8beccc9412936
  - name: seafileltd/sdoc-server
    newTag: 1.0.5-arm
  - name: seafileltd/notification-server
    newTag: 13.0.7-arm
  - name: memcached
    newTag: 1.6.45-alpine
  - name: elasticsearch
    newTag: 9.5.5
