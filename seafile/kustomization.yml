apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seafile
resources:
  - ./deployment.yml
  - ./service.yml
  # Native admin/OAuth/file I/O and SeaDoc/notification dependencies verified.
  - ./ingress.yml
  - ./secret.yml
  - ./dependencies.yml
configMapGenerator:
  - name: seafile-integration
    files:
      - initialize.py
      - seahub_lab.py
      - seahub_custom_functions.py
      - native-schema.json
      - prepare_mysql_plugins.py
images:
  - name: seafileltd/seafile-pro-mc
    newTag: 12.0.17-arm
  - name: seafileltd/sdoc-server
    newTag: 1.0.5-arm
  - name: seafileltd/notification-server
    newTag: 13.0.7-arm
  - name: memcached
    newTag: 1.6.45-alpine
  - name: elasticsearch
    newTag: 9.5.5
