apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: mysql-client-plugins
          image: seafileltd/seafile-pro-mc:12.0.14-arm
          command: [python3, /lab-config/prepare_mysql_plugins.py]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: integration
              mountPath: /lab-config
              readOnly: true
            - name: mysql-client-plugins
              mountPath: /run/mariadb-client-plugins
            - name: plugin-scratch
              mountPath: /tmp
        - name: native-initialize
          image: seafileltd/seafile-pro-mc:12.0.14-arm
          command: [python3, /lab-config/initialize.py]
          env:
            - name: TIME_ZONE
              value: Asia/Seoul
            - name: SEAFILE_SERVER_HOSTNAME
              value: drive.pmh.codes
            - name: SEAFILE_SERVER_PROTOCOL
              value: https
            - name: DB_HOST
              value: mysql-service.database.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: seafile
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: seafile-storage
              mountPath: /shared
            - name: integration
              mountPath: /lab-config
              readOnly: true
      containers:
        - name: seafile
          image: seafileltd/seafile-pro-mc:12.0.14-arm
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /api2/ping/
              port: 80
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api2/ping/
              port: 80
          env:
            - name: MARIADB_PLUGIN_DIR
              value: /run/mariadb-client-plugins
            - name: TIME_ZONE
              value: Asia/Seoul
            - name: SEAFILE_LOG_TO_STDOUT
              value: "true"
            - name: SITE_ROOT
              value: "/"
            - name: ENABLE_SEADOC
              value: "true"
            - name: SEADOC_SERVER_URL
              value: "https://drive.pmh.codes/sdoc-server"
            - name: SEAFILE_SERVER_HOSTNAME
              value: "drive.pmh.codes"
            - name: SEAFILE_SERVER_PROTOCOL
              value: "https"
            - name: DB_HOST
              value: "mysql-service.database.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "seafile"
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: "seafile_db"
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: "ccnet_db"
            - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
              value: "seahub_db"
            - name: INIT_SEAFILE_ADMIN_EMAIL
              value: "pmh_only@pmh.codes"
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: JWT_PRIVATE_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: DB_PASSWORD
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: OAUTH_CLIENT_SECRET
            - name: INIT_SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: INIT_SEAFILE_ADMIN_PASSWORD
          volumeMounts:
            - name: mysql-client-plugins
              mountPath: /run/mariadb-client-plugins
              readOnly: true
            - mountPath: /shared
              name: seafile-storage
      volumes:
        - name: mysql-client-plugins
          emptyDir: {}
        - name: plugin-scratch
          emptyDir: {}
        - name: integration
          configMap:
            name: seafile-integration
        - name: seafile-storage
          hostPath:
            path: /mnt/data/seafile
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-sdoc
  annotations:
    # SeaDoc also creates Seahub tables; wait for the native core schema first.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seafile-sdoc
  template:
    metadata:
      labels:
        app: seafile-sdoc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seafile
          image: seafileltd/sdoc-server:1.0.5-arm
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
          ports:
            - containerPort: 80
          env:
            - name: TIME_ZONE
              value: Asia/Seoul
            - name: SEAHUB_SERVICE_URL
              value: "http://seafile-service"
            - name: SEAFILE_SERVER_PROTOCOL
              value: "https"
            - name: DB_HOST
              value: "mysql-service.database.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "seafile"
            - name: DB_NAME
              value: "seahub_db"
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: JWT_PRIVATE_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /opt/seadoc-data
              name: seafile-seadoc-storage
      volumes:
        - name: seafile-seadoc-storage
          hostPath:
            path: /mnt/data/seafile-seadoc
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-noti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seafile-noti
  template:
    metadata:
      labels:
        app: seafile-noti
    spec:
      automountServiceAccountToken: false
      # Retain the existing node-local notification state and logs.
      nodeSelector:
        kubernetes.io/hostname: pmhoci
      containers:
        - name: seafile
          image: seafileltd/notification-server:12.0.11-arm
          startupProbe:
            httpGet:
              path: /ping
              port: 8083
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8083
          ports:
            - containerPort: 8083
          env:
            - name: SEAFILE_MYSQL_DB_HOST
              value: "mysql-service.database.svc.cluster.local"
            - name: SEAFILE_MYSQL_DB_PORT
              value: "3306"
            - name: SEAFILE_MYSQL_DB_USER
              value: "seafile"
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: "ccnet_db"
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: "seafile_db"
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: JWT_PRIVATE_KEY
            - name: SEAFILE_MYSQL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /shared
              name: seafile-noti-storage
      volumes:
        - name: seafile-noti-storage
          hostPath:
            path: /mnt/data/seafile-noti
            type: DirectoryOrCreate
