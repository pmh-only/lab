apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: velero
    serviceAccount: vault-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: velero-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: velero/s3
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: velero-s3
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: velero-repo-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: velero/s3
  refreshAfter: 1m
  destination:
    create: true
    # Velero created its bootstrap Secret before FSB was enabled. No backup
    # repositories exist yet; adopt it with the Vault-held fresh password.
    overwrite: true
    name: velero-repo-credentials
    type: Opaque
