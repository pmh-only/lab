apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  annotations:
    # Jobs read the current Secret on startup; a Secret/ConfigMap change must
    # not trigger extra runs, especially while the schedule is suspended.
    reloader.stakater.com/auto: "false"
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Seoul
  # Enable only after the first backup and isolated restore pass.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "false"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          annotations:
            reloader.stakater.com/auto: "false"
          labels:
            app: database-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: export
              image: ghcr.io/pmh-only/postgres:18
              command: [sh, /scripts/export.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - {name: ENGINE, value: pgsql}
                - {name: DATABASE_HOST, value: pgsql-service}
                - {name: DATABASE_USER, value: admin}
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: pgsql-root-password, key: password}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: scratch, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: upload
              image: ghcr.io/pmh-only/backpack-pgsql2s3:latest
              command: [sh, /scripts/upload.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - {name: ENGINE, value: pgsql}
                - {name: BACKUP_NAME, value: pgsql}
                - {name: S3_ENDPOINT_URL, value: "http://pmhraspberry.tailscale.svc.cluster.local:9000"}
                - {name: AWS_DEFAULT_REGION, value: us-east-1}
                - {name: HOME, value: /tmp}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: backpack-secrets, key: S3_ACCESS_TOKEN}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: backpack-secrets, key: S3_SECRET_TOKEN}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: scratch, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: scripts
              configMap: {name: database-backup-scripts}
            - name: scratch
              emptyDir: {sizeLimit: 20Gi}
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
