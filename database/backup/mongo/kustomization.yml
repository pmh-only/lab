apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -mongo
resources:
  - ../base
patches:
  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: backup
      spec:
        schedule: "40 3 * * *"
        suspend: false
        jobTemplate:
          spec:
            template:
              spec:
                initContainers:
                  - name: export
                    image: ghcr.io/pmh-only/mongo:latest
                    env:
                      - {name: ENGINE, value: mongo}
                      - {name: DATABASE_HOST, value: mongo-service}
                      - {name: DATABASE_USER, value: backpack}
                      - name: DATABASE_PASSWORD
                        valueFrom:
                          secretKeyRef: {name: backpack-secrets, key: MONGO_BACKPACK_PASSWORD}
                containers:
                  - name: upload
                    env:
                      - {name: ENGINE, value: mongo}
                      - {name: BACKUP_NAME, value: mongo}
