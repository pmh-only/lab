---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: clickhouse-root-password
  namespace: database
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: database/clickhouse-root-password
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: clickhouse-root-password
    type: Opaque
