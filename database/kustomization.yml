apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - ./backpack.yml
  - ./mysql/pvc.yml
  - ./mysql/deployment.yml
  - ./mysql/secret.yml
  - ./mysql/service.yml
  - ./pgsql/pvc.yml
  - ./pgsql/recovery-pvc.yml
  - ./pgsql/deployment.yml
  - ./pgsql/secret.yml
  - ./pgsql/service.yml
  - ./clickhouse/pvc.yml
  - ./clickhouse/deployment.yml
  - ./clickhouse/configmap.yml
  - ./clickhouse/secret.yml
  - ./clickhouse/service.yml
  - ./mongo/pvc.yml
  - ./mongo/deployment.yml
  - ./mongo/service.yml
  - ./redis/deployment.yml
  - ./redis/service.yml
# Temporary fresh-cluster bootstrap without Tailscale/S3 backups; see todo.md.
# Remove both patches only after provisioning and testing the backup dependencies.
patches:
  # A node-local RWO PVC can still be mounted by two Pods on the same node.
  # Never overlap database writers during a Secret-triggered restart.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (mysql|pgsql|clickhouse|mongo)
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (mysql|pgsql|clickhouse|mongo)
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
  - target:
      group: secrets.hashicorp.com
      version: v1beta1
      kind: VaultStaticSecret
      name: backpack-secrets
    patch: |-
      apiVersion: secrets.hashicorp.com/v1beta1
      kind: VaultStaticSecret
      metadata:
        name: backpack-secrets
      $patch: delete
