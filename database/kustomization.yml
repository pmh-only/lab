apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - ./backpack.yml
  - ./mysql/pvc.yml
  - ./mysql/deployment.yml
  - ./mysql/secret.yml
  - ./mysql/service.yml
  - ./pgsql/pvc.yml
  - ./pgsql/recovery-pvc.yml
  - ./pgsql/deployment.yml
  - ./pgsql/secret.yml
  - ./pgsql/service.yml
  - ./clickhouse/pvc.yml
  - ./clickhouse/deployment.yml
  - ./clickhouse/configmap.yml
  - ./clickhouse/secret.yml
  - ./clickhouse/service.yml
  - ./mongo/pvc.yml
  - ./mongo/deployment.yml
  - ./mongo/service.yml
  - ./redis/deployment.yml
  - ./redis/service.yml
  - ./backup/pgsql
  - ./backup/mysql
  - ./backup/mongo
  - ./backup/clickhouse
  - ./backup/immich
configMapGenerator:
  - name: database-backup-scripts
    files:
      - backup/export.sh
      - backup/upload.sh
      - backup/clickhouse.sh
# Legacy backup sidecars stay off: checked CronJobs back up over the Services
# without restarting the database writers or sharing their live data volumes.
patches:
  # A node-local RWO PVC can still be mounted by two Pods on the same node.
  # Never overlap database writers during a Secret-triggered restart.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (mysql|pgsql|clickhouse|mongo)
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (mysql|pgsql|clickhouse|mongo)
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
images:
  - name: ghcr.io/pmh-only/clickhouse-server
    newTag: rybbit
    digest: sha256:9b02d0299f4ca98dd64a28594c2e9ee4a107b5d7431ee67f9f6375cd84fc04a9
