---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mysql-root-password
  namespace: database
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: database/mysql-root-password
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: mysql-root-password
    type: Opaque
    labels:
      app.kubernetes.io/instance: database
