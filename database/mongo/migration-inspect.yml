apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-upgrade-20261002-inspect
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: inventory
          image: alpine:3.23
          command:
            - /bin/sh
            - -ec
            - |
              echo "Pre-upgrade inventory:"
              cat /backup/before.json
              echo "After FCV 8.3:"
              cat /backup/test-8.3.json
              echo "Backup size:"
              ls -lh /backup/pre-upgrade.tar.gz
          volumeMounts:
            - { name: backup, mountPath: /backup, readOnly: true }
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: mongo-upgrade-20261002-backup
