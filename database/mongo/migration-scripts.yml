apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-upgrade-20261002-scripts
data:
  inventory.js: |
    const result = [];
    const databases = db.adminCommand({ listDatabases: 1, nameOnly: true });
    if (databases.ok !== 1) throw new Error("Cannot list databases");
    for (const { name } of databases.databases.sort((a, b) => a.name.localeCompare(b.name))) {
      if (name === "local") continue;
      const database = db.getSiblingDB(name);
      for (const collection of database.getCollectionInfos({ type: "collection" })
        .sort((a, b) => a.name.localeCompare(b.name))) {
        if (collection.name === "system.profile" ||
          (name === "admin" && collection.name === "system.version")) continue;
        const target = database.getCollection(collection.name);
        result.push({
          database: name,
          collection: collection.name,
          documents: target.countDocuments({}),
          indexes: target.getIndexes().map(index => index.name).sort(),
        });
      }
    }
    print(JSON.stringify(result));
  upgrade.sh: |
    #!/bin/bash
    set -euo pipefail
    mongod --dbpath "$DBPATH" --bind_ip 127.0.0.1 --port 27017 \
      --wiredTigerCacheSizeGB 0.5 --setParameter ttlMonitorEnabled=false \
      --fork --logpath /tmp/mongod.log || { cat /tmp/mongod.log; exit 1; }
    trap 'mongod --dbpath "$DBPATH" --shutdown' EXIT
    mongosh --quiet --eval '
      const version = db.version();
      if (!version.startsWith(process.env.VERSION_PREFIX + "."))
        throw new Error("Unexpected binary version: " + version);
      const result = db.adminCommand({ getParameter: 1, featureCompatibilityVersion: 1 });
      const fcv = result.featureCompatibilityVersion;
      if (result.ok !== 1 || fcv.targetVersion ||
          ![process.env.EXPECTED_FCV, process.env.TARGET_FCV].includes(fcv.version))
        throw new Error("Unexpected compatibility state: " + JSON.stringify(result));
      print("Starting " + process.env.PHASE + " with MongoDB " + version + ", FCV " + fcv.version);
    '
    mongosh --quiet /scripts/inventory.js > /tmp/inventory.json
    if [ "$PHASE" = "test-8.3" ]; then
      cp /tmp/inventory.json /backup/before.json
    else
      cmp /backup/before.json /tmp/inventory.json
    fi
    mongosh --quiet --eval '
      const result = db.adminCommand({
        setFeatureCompatibilityVersion: process.env.TARGET_FCV,
        confirm: true,
      });
      if (result.ok !== 1) throw new Error(JSON.stringify(result));
      const fcv = db.adminCommand({ getParameter: 1, featureCompatibilityVersion: 1 });
      if (fcv.ok !== 1 || fcv.featureCompatibilityVersion.version !== process.env.TARGET_FCV ||
          fcv.featureCompatibilityVersion.targetVersion)
        throw new Error("Migration incomplete: " + JSON.stringify(fcv));
      print("Verified FCV " + process.env.TARGET_FCV);
    '
    mongosh --quiet /scripts/inventory.js > /backup/"$PHASE".json
    cmp /backup/before.json /backup/"$PHASE".json
    echo "$PHASE: document counts and index names match the pre-upgrade inventory"
