---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: trace-secrets
  namespace: trace
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: trace/trace-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: trace-secrets
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: trace-auth-secrets
  namespace: trace
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: trace/trace-auth-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: trace-auth-secrets
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: trace
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: trace
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: trace
    serviceAccount: vault-auth
    audiences:
    - vault
