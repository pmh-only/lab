apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: trace
  template:
    metadata:
      labels:
        app: trace
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: native-client-compatibility
          image: ghcr.io/rybbit-io/rybbit-backend:latest
          command: [node, /bootstrap/prepare-clickhouse-client.mjs]
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: native-client
              mountPath: /prepared
      containers:
        - name: trace
          image: ghcr.io/rybbit-io/rybbit-backend:latest
          ports:
            - containerPort: 3001
          startupProbe:
            httpGet:
              path: /api/health
              port: 3001
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
          volumeMounts:
            - name: native-client
              mountPath: /app/dist/db/clickhouse/client.js
              subPath: client.js
              readOnly: true
          env:
            - name: NODE_ENV
              value: "production"

            - name: CLICKHOUSE_HOST
              value: "http://clickhouse-service.database.svc.cluster.local:8123"
            - name: CLICKHOUSE_DB
              value: "traffic"
            - name: CLICKHOUSE_USER
              value: "traffic"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_QUERY_USER
              value: traffic_query
            - name: CLICKHOUSE_QUERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: CLICKHOUSE_QUERY_PASSWORD

            - name: POSTGRES_HOST
              value: "pgsql-service.database.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "traffic"
            - name: POSTGRES_USER
              value: "traffic"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: POSTGRES_PASSWORD

            - name: REDIS_HOST
              value: redis-service.database.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"

            - name: DISABLE_SIGNUP
              value: "true"
            - name: BASE_URL
              value: "https://trace.pmh.codes"
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: BETTER_AUTH_SECRET

            - name: MAPBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trace-secrets
                  key: MAPBOX_TOKEN
      volumes:
        - name: native-client
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: trace-bootstrap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-client
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: trace-client
  template:
    metadata:
      labels:
        app: trace-client
    spec:
      automountServiceAccountToken: false
      containers:
        - name: trace-client
          image: ghcr.io/rybbit-io/rybbit-client:latest
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /
              port: 3002
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://trace.pmh.codes"
            - name: NEXT_PUBLIC_DISABLE_SIGNUP
              value: "true"
