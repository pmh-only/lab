apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: mail
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  writeBackConfig:
    method: git:secret:argocd/git
    gitConfig:
      repository: git@github.com:pmh-only/lab.git
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: mail
      images:
        - alias: mail
          imageName: ghcr.io/pmh-only/mail:latest
          commonUpdateSettings:
            updateStrategy: digest
        - alias: mail-worker
          imageName: ghcr.io/pmh-only/mail-worker:latest
          commonUpdateSettings:
            updateStrategy: digest
