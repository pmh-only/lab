# Chart versions stay pinned; signed Git commits update only the image values.
# Vault remains manual-sync because its single Shamir-sealed member needs unseal.
apiVersion: v1
kind: List
items:
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: cert-manager, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/cert-manager.yml'}
      applicationRefs:
        - namePattern: cert-manager
          images:
            - {alias: controller, imageName: 'quay.io/jetstack/cert-manager-controller:v1.21.3', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
            - {alias: webhook, imageName: 'quay.io/jetstack/cert-manager-webhook:v1.21.3', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: webhook.image.tag}}}
            - {alias: cainjector, imageName: 'quay.io/jetstack/cert-manager-cainjector:v1.21.3', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: cainjector.image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: cert-manager-technitium-webhook, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/cert-manager-technitium-webhook.yml'}
      applicationRefs:
        - namePattern: cert-manager-technitium-webhook
          images:
            - {alias: webhook, imageName: 'ghcr.io/pmh-only/cert-manager-technitium-webhook:latest', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: descheduler, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/descheduler.yml'}
      applicationRefs:
        - namePattern: descheduler
          images:
            - {alias: descheduler, imageName: 'registry.k8s.io/descheduler/descheduler:v0.37.0', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: envoy-gateway, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/envoy-gateway.yml'}
      applicationRefs:
        - namePattern: envoy-gateway
          images:
            - {alias: gateway, imageName: 'docker.io/envoyproxy/gateway:v1.9.2', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {spec: global.images.envoyGateway.image}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: otp, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/otp.yml'}
      applicationRefs:
        - namePattern: otp
          images:
            - {alias: otp, imageName: 'ghcr.io/pmh-only/otp:v0.4.0', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: pdf, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/pdf.yml'}
      applicationRefs:
        - namePattern: pdf
          images:
            - {alias: stirling, imageName: 'docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.5.1', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: reloader, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/reloader.yml'}
      applicationRefs:
        - namePattern: reloader
          images:
            - {alias: reloader, imageName: 'ghcr.io/stakater/reloader:v1.4.22', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: tailscale, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/tailscale.yml'}
      applicationRefs:
        - namePattern: tailscale
          images:
            - {alias: operator, imageName: 'tailscale/k8s-operator:v1.104.2', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: operatorConfig.image.tag}}}
            - {alias: proxy, imageName: 'tailscale/tailscale:v1.104.2', commonUpdateSettings: {updateStrategy: digest, forceUpdate: true}, manifestTargets: {helm: {tag: proxyConfig.image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: vault, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/vault.yml'}
      applicationRefs:
        - namePattern: vault
          images:
            - {alias: vault, imageName: 'hashicorp/vault:2.0.4', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: server.image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: vault-secrets-operator, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/vault-secrets-operator.yml'}
      applicationRefs:
        - namePattern: vault-secrets-operator
          images:
            - {alias: operator, imageName: 'hashicorp/vault-secrets-operator:1.6.0', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: controller.manager.image.tag}}}
            - {alias: rbac-proxy, imageName: 'quay.io/brancz/kube-rbac-proxy:v0.18.1', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: controller.kubeRbacProxy.image.tag}}}
