# Charts track latest stable releases; signed Git commits update image values.
# All Vault components, including vault-secrets-operator, stay manually pinned.
apiVersion: v1
kind: List
items:
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: cert-manager, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/cert-manager.yml'}
      applicationRefs:
        - namePattern: cert-manager
          images:
            - {alias: controller, imageName: 'quay.io/jetstack/cert-manager-controller:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: image.tag}}}
            - {alias: webhook, imageName: 'quay.io/jetstack/cert-manager-webhook:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: webhook.image.tag}}}
            - {alias: cainjector, imageName: 'quay.io/jetstack/cert-manager-cainjector:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: cainjector.image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: cert-manager-technitium-webhook, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/cert-manager-technitium-webhook.yml'}
      applicationRefs:
        - namePattern: cert-manager-technitium-webhook
          images:
            - {alias: webhook, imageName: 'ghcr.io/pmh-only/cert-manager-technitium-webhook:latest', commonUpdateSettings: {updateStrategy: digest}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: descheduler, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/descheduler.yml'}
      applicationRefs:
        - namePattern: descheduler
          images:
            - {alias: descheduler, imageName: 'registry.k8s.io/descheduler/descheduler:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: envoy-gateway, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/envoy-gateway.yml'}
      applicationRefs:
        - namePattern: envoy-gateway
          images:
            - {alias: gateway, imageName: 'docker.io/envoyproxy/gateway:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {spec: global.images.envoyGateway.image}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: otp, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/otp.yml'}
      applicationRefs:
        - namePattern: otp
          images:
            - {alias: otp, imageName: 'ghcr.io/pmh-only/otp:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: pdf, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/pdf.yml'}
      applicationRefs:
        - namePattern: pdf
          images:
            - {alias: stirling, imageName: 'docker.stirlingpdf.com/stirlingtools/stirling-pdf:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: reloader, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/reloader.yml'}
      applicationRefs:
        - namePattern: reloader
          images:
            - {alias: reloader, imageName: 'ghcr.io/stakater/reloader:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: tailscale, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/tailscale.yml'}
      applicationRefs:
        - namePattern: tailscale
          images:
            - {alias: operator, imageName: 'tailscale/k8s-operator:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: operatorConfig.image.tag}}}
            - {alias: proxy, imageName: 'tailscale/tailscale:*', commonUpdateSettings: {updateStrategy: semver, forceUpdate: true}, manifestTargets: {helm: {tag: proxyConfig.image.tag}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: velero, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/velero.yml'}
      applicationRefs:
        - namePattern: velero
          images:
            # Bare numeric build tags (e.g. 1220) are coerced to huge semver majors.
            # Only official release tags are eligible; major upgrades remain allowed.
            - {alias: velero, imageName: 'docker.io/velero/velero:*', commonUpdateSettings: {updateStrategy: semver, allowTags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+$'}, manifestTargets: {helm: {tag: image.tag}}}
            - {alias: aws-plugin, imageName: 'velero/velero-plugin-for-aws:*', commonUpdateSettings: {updateStrategy: semver, allowTags: 'regexp:^v[0-9]+\.[0-9]+\.[0-9]+$'}, manifestTargets: {helm: {spec: 'initContainers[0].image'}}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: velero-ui, namespace: argocd}
    spec:
      writeBackConfig:
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: 'helmvalues:/image-updater/helm-values/velero-ui.yml'}
      applicationRefs:
        - namePattern: velero-ui
          images:
            - {alias: velero-ui, imageName: 'otwld/velero-ui:*', commonUpdateSettings: {updateStrategy: semver}, manifestTargets: {helm: {tag: image.tag}}}
