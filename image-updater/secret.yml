apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-updater-vault-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: image-updater-vault
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: image-updater
    serviceAccount: image-updater-vault-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: image-updater-git
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  vaultAuthRef: image-updater-vault
  mount: secret
  type: kv-v2
  path: argocd/image-updater-git
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: git
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: argocd-image-updater-controller
