apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/v1.4.0/config/install.yaml
  - secret.yml
  - mail.yml
  - reviewed.yml
  - deployed.yml
  - helm.yml
images:
  - name: quay.io/argoprojlabs/argocd-image-updater
    newTag: v1.4.0
    digest: sha256:a8054f5b48e0e40318d7026c50486e72acb341a4d801c32fb70ac20101cdce10
patches:
  - target:
      kind: CustomResourceDefinition
    path: patches/crd.json
  - target:
      kind: ConfigMap
      name: argocd-image-updater-config
    path: patches/config.yml
  - target:
      kind: Deployment
      name: argocd-image-updater-controller
    path: patches/controller.yml
