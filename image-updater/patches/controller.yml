apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater-controller
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: argocd-image-updater-controller
          args:
            - --metrics-bind-address=:8443
            - run
            - --warmup-cache=false
          startupProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: ssh-signing-key
          secret:
            secretName: git
            optional: false
            defaultMode: 0440
