# Existing compatibility-reviewed updaters, now owned by the image-updater app.
# Explicitly enabled running apps are also in deployed.yml and helm.yml.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: books
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/git"
    gitConfig:
      repository: git@github.com:pmh-only/lab.git
      branch: main
      writeBackTarget: kustomization
  applicationRefs:
    - namePattern: books
      images:
        - alias: books-frontend
          imageName: ghcr.io/documentlane/doclane-frontend:latest
          commonUpdateSettings:
            updateStrategy: digest
        - alias: books-backend
          imageName: ghcr.io/documentlane/doclane-backend:latest
          commonUpdateSettings:
            updateStrategy: digest
        - alias: books-worker
          imageName: ghcr.io/documentlane/doclane-worker:latest
          commonUpdateSettings:
            updateStrategy: digest
---
