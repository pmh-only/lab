# All running Git/Kustomize apps. Track the existing tag, never cross major versions.
# Paused Welplan workloads are deliberately absent.
apiVersion: v1
kind: List
items:
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: authentik, namespace: argocd}
    spec:
      writeBackConfig: &git
        method: git:secret:argocd/git
        gitConfig: {repository: 'git@github.com:pmh-only/lab.git', branch: main, writeBackTarget: kustomization}
      applicationRefs:
        - namePattern: authentik
          images:
            - {alias: authentik, imageName: 'ghcr.io/goauthentik/server:2026.8.4', commonUpdateSettings: {updateStrategy: digest}}
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata: {name: as218822, namespace: argocd}
    spec:
      writeBackConfig: *git
      applicationRefs:
        - namePattern: as218822
          images:
            - {alias: ripe-atlas, imageName: 'ghcr.io/pmh-only/as218822-ripe-atlas:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: here, imageName: 'ghcr.io/pmh-only/here:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: as218822, imageName: 'ghcr.io/pmh-only/as218822:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: gre-gateway, imageName: 'ghcr.io/pmh-only/as218822-gre-gateway:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: looking-glass, imageName: 'ghcr.io/pmh-only/as218822-looking-glass:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: console, imageName: 'ghcr.io/pmh-only/as218822-console:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: website, imageName: 'ghcr.io/pmh-only/as218822-website:latest', commonUpdateSettings: {updateStrategy: digest}}
            - {alias: tailscale, imageName: 'ghcr.io/tailscale/tailscale:latest', commonUpdateSettings: {updateStrategy: digest}}
