apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thepool-backend-tls
spec:
  secretName: thepool-backend-tls
  dnsNames:
    - pool.pmh.codes
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-public
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
    size: 256
  usages:
    - digital signature
    - server auth
