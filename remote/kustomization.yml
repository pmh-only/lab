apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: remote
resources:
  - ./deployment.yml
  - ./service.yml
  # Native schema/owner login verified; upstream default account rejected.
  - ./ingress.yml
  - ./secret.yml
  - ./initialize-job.yml
configMapGenerator:
  - name: remote-initialize
    files:
      - initialize.sql
images:
  - name: ghcr.io/pmh-only/guacamole
    newTag: 1.6.0
  - name: ghcr.io/pmh-only/guacd
    newTag: 1.6.0
