apiVersion: batch/v1
kind: Job
metadata:
  name: keysboard-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          command: [node, /bootstrap/migrate.cjs]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: keysboard-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: migration
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: migration
          configMap:
            name: keysboard-migration
