apiVersion: batch/v1
kind: Job
metadata:
  name: keysboard-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/pmh-only/keysboard:latest
          command: [node, /opt/migrator/node_modules/prisma/build/index.js, migrate, deploy, --schema=/app/prisma/schema.prisma]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: keysboard-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
