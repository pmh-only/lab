apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: minio-secrets
  namespace: minio
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: minio/minio-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: minio-secrets
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rustfs-oidc
  namespace: minio
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: minio/rustfs-oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: rustfs-oidc
    type: Opaque
  rolloutRestartTargets:
    - kind: Deployment
      name: minio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: minio
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: minio
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: minio
    serviceAccount: vault-auth
    audiences:
    - vault
