apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # Existing /mnt/data/minio is node-local; never start on an empty peer disk.
      nodeSelector:
        kubernetes.io/hostname: pmhoci
      initContainers:
        - name: data-directory-permissions
          image: ghcr.io/pmh-only/rustfs:latest
          command: [/bin/sh, -ec, "chown 10001:10001 /data"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: minio-storage
              mountPath: /data
      containers:
        - name: minio
          image: ghcr.io/pmh-only/rustfs:latest
          startupProbe:
            exec:
              command:
                - curl
                - -kfH
                - "Host: hello.s3.pmh.codes"
                - https://localhost:9000/index.html
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - curl
                - -kfH
                - "Host: hello.s3.pmh.codes"
                - https://localhost:9000/index.html
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 1
          env:
            - name: RUSTFS_BROWSER_REDIRECT_URL
              value: https://rustfs.pmh.codes
            - name: RUSTFS_IDENTITY_OPENID_ENABLE_pmh_codes
              value: "on"
            - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL_pmh_codes
              value: https://auth.pmh.codes/application/o/rustfs/
            - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID_pmh_codes
              value: lab-rustfs
            - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET_pmh_codes
              valueFrom:
                secretKeyRef:
                  name: rustfs-oidc
                  key: client-secret
            - name: RUSTFS_IDENTITY_OPENID_SCOPES_pmh_codes
              value: openid,profile,email,rustfs
            - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_pmh_codes
              value: https://rustfs.pmh.codes/rustfs/admin/v3/oidc/callback/pmh_codes
            - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC_pmh_codes
              value: "off"
            - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME_pmh_codes
              value: Authentik
            # Only the explicit superuser-gated Authentik claim grants access.
            # Do not map arbitrary identity-provider groups or grant all logins.
            - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME_pmh_codes
              value: rustfs_policy
            - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM_pmh_codes
              value: rustfs_policy
            - name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM_pmh_codes
              value: ""
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_SERVER_DOMAINS
              value: s3.pmh.codes:9000
            - name: RUSTFS_DRIVE_ACTIVE_MONITORING
              value: "false"
            - name: RUSTFS_TLS_PATH
              value: /tls
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_USER
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - mountPath: /data
              name: minio-storage
            - mountPath: /tls
              name: minio-tls-secret
      volumes:
        - name: minio-storage
          hostPath:
            path: /mnt/data/minio
        - name: minio-tls-secret
          secret:
            secretName: minio-tls-secret
            items:
            - key: tls.crt
              path: rustfs_cert.pem
            - key: tls.key
              path: rustfs_key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  clusterIP: 172.17.0.40
  selector:
    app: minio
  ports:
    - name: s3
      protocol: TCP
      port: 443
      targetPort: 9000

    - name: console
      protocol: TCP
      port: 9001
      targetPort: 9001
