apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kopia-backup
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
    path: kopia/backup
  destination:
    namespace: kopia
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
