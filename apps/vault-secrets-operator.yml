apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  destination:
    namespace: vault-secrets-operator
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: vault-secrets-operator
    repoURL: https://helm.releases.hashicorp.com
    targetRevision: 1.6.0
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/vault-secrets-operator.yml
      valuesObject:
        defaultVaultConnection:
          enabled: false
        defaultAuthMethod:
          enabled: false
        controller:
          manager:
            globalTransformationOptions:
              excludeRaw: true
  - repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
    ref: imageValues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
