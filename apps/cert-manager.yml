apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: cert-manager
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/cert-manager.yml
      valuesObject:
        extraObjects:
          - |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: vault-auth
              namespace: cert-manager
            automountServiceAccountToken: false
          - |
            apiVersion: secrets.hashicorp.com/v1beta1
            kind: VaultAuth
            metadata:
              name: vault
              namespace: cert-manager
            spec:
              vaultConnectionRef: vault/cluster
              method: kubernetes
              mount: kubernetes
              kubernetes:
                role: cert-manager
                serviceAccount: vault-auth
                audiences:
                  - vault
          - |
            apiVersion: secrets.hashicorp.com/v1beta1
            kind: VaultStaticSecret
            metadata:
              name: technitium-api-token
              namespace: cert-manager
            spec:
              vaultAuthRef: vault
              mount: secret
              type: kv-v2
              path: cert-manager/technitium-api-token
              refreshAfter: 1m
              destination:
                create: true
                overwrite: false
                name: technitium-api-token
                type: Opaque
          - |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: technitium-api-token-reader
              namespace: cert-manager
            rules:
              - apiGroups: [""]
                resources: ["secrets"]
                resourceNames: ["technitium-api-token"]
                verbs: ["get"]
          - |
            apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: technitium-api-token-reader
              namespace: cert-manager
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: Role
              name: technitium-api-token-reader
            subjects:
              - kind: ServiceAccount
                name: cert-manager-technitium-webhook
                namespace: cert-manager
          - |
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: letsencrypt-public
            spec:
              acme:
                email: pmh_only@pmh.codes
                server: https://acme-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: letsencrypt-public-account-key
                solvers:
                  - dns01:
                      webhook:
                        groupName: acme.xver.cloud
                        solverName: technitium
                        config:
                          serverUrl: http://nameserver.nameserver.svc.cluster.local:5380
                          authTokenSecretRef:
                            name: technitium-api-token
                            key: api-token
                    selector:
                      dnsZones:
                        - as218822.net
                        - not.ai.kr
                        - pmh.so
                        - pmh.codes
          - |
            apiVersion: cert-manager.io/v1
            kind: ClusterIssuer
            metadata:
              name: letsencrypt-staging
            spec:
              acme:
                email: pmh_only@pmh.codes
                server: https://acme-staging-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: letsencrypt-staging-account-key
                solvers:
                  - dns01:
                      webhook:
                        groupName: acme.xver.cloud
                        solverName: technitium
                        config:
                          serverUrl: http://nameserver.nameserver.svc.cluster.local:5380
                          authTokenSecretRef:
                            name: technitium-api-token
                            key: api-token
                    selector:
                      dnsZones:
                        - as218822.net
                        - pmh.so
                        - pmh.codes
        crds:
          enabled: true
        global:
          revisionHistoryLimit: 0
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
    repoURL: https://charts.jetstack.io
    targetRevision: x
  - repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
    ref: imageValues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-technitium-webhook
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  sources:
    - ref: imageValues
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: HEAD
    - chart: cert-manager-technitium-webhook
      repoURL: https://kittizz.github.io/cert-manager-technitium-webhook
      targetRevision: x
      helm:
        valueFiles:
          - $imageValues/image-updater/helm-values/cert-manager-technitium-webhook.yml
        valuesObject:
          fullnameOverride: cert-manager-technitium-webhook
          replicaCount: 1
          groupName: acme.xver.cloud
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
