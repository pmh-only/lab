apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: cert-manager
    helm:
      valuesObject:
        crds:
          enabled: true
        global:
          revisionHistoryLimit: 0
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53
    repoURL: https://charts.jetstack.io
    targetRevision: x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-technitium-webhook
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: cert-manager/technitium
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: HEAD
    - chart: cert-manager-technitium-webhook
      repoURL: https://kittizz.github.io/cert-manager-technitium-webhook
      targetRevision: 1.0.0
      helm:
        valuesObject:
          fullnameOverride: cert-manager-technitium-webhook
          replicaCount: 1
          groupName: acme.xver.cloud
          image:
            repository: ghcr.io/pmh-only/cert-manager-technitium-webhook
            tag: latest@sha256:318ce07a8b078dca54316594a753052b6e27a5dcc25ab4dfcfbf983deeed3151
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
