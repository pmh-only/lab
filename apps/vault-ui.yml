apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-ui
  namespace: argocd
spec:
  destination:
    namespace: vault
    server: https://kubernetes.default.svc
  project: default
  source:
    path: vault_ui
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
  # Routing only: never sync/upgrade/restart the manually managed Vault server.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
