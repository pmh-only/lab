apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: envoy-gateway-system
    server: https://kubernetes.default.svc
  project: default
  sources:
  - path: .
    repoURL: oci://docker.io/envoyproxy/gateway-helm
    targetRevision: v1.9.2
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/envoy-gateway.yml
      valuesObject:
        config:
          envoyGateway:
            extensionApis:
              enableBackend: true
              enableLua: true
              enableEnvoyPatchPolicy: true
  - repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
    ref: imageValues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
