apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdf
  namespace: argocd
spec:
  destination:
    namespace: pdf
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: stirling-pdf-chart
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/pdf.yml
      valuesObject:
        fullnameOverride: pdf
        persistence:
          enabled: true
        deployment:
          extraVolumeMounts:
            - name: storage-volume
              mountPath: /usr/share/tessdata
              subPath: tessdata
            - name: storage-volume
              mountPath: /configs
              subPath: configs
            - name: storage-volume
              mountPath: /logs
              subPath: logs
            - name: storage-volume
              mountPath: /pipeline
              subPath: pipeline
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
    # Official published index; avoids the old Pages URL's HTTP redirect.
    repoURL: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF-chart/gh-pages
    targetRevision: x
  # This chart has no extraObjects support; render routing/secrets in this app.
  - path: pdf_configs
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
    ref: imageValues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
