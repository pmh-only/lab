apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdf
  namespace: argocd
spec:
  destination:
    namespace: pdf
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: stirling-pdf-chart
    helm:
      valuesObject:
        fullnameOverride: pdf
        persistence:
          enabled: true
        deployment:
          extraVolumeMounts:
            - name: storage-volume
              mountPath: /usr/share/tessdata
              subPath: tessdata
            - name: storage-volume
              mountPath: /configs
              subPath: configs
            - name: storage-volume
              mountPath: /logs
              subPath: logs
            - name: storage-volume
              mountPath: /pipeline
              subPath: pipeline
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
    # Official published index; avoids the old Pages URL's HTTP redirect.
    repoURL: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF-chart/gh-pages
    targetRevision: 3.1.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdf-configs
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: pdf
    server: https://kubernetes.default.svc
  project: default
  source:
    path: pdf_configs
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: pdf
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: pdf
      images:
        - alias: stirling
          imageName: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest-fat
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: image.name
              tag: image.tag
