apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nameserver-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: nameserver
    server: https://kubernetes.default.svc
  project: default
  source:
    path: nameserver/secrets
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
