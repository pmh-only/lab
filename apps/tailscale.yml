apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  project: default
  ignoreDifferences:
    - jsonPointers:
        - /data
      kind: Secret
  sources:
    - path: tailscale_auth
      ref: imageValues
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: main
    - chart: tailscale-operator
      repoURL: https://pkgs.tailscale.com/helmcharts
      targetRevision: 1.104.2
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $imageValues/image-updater/helm-values/tailscale.yml
        valuesObject:
          # VSO creates operator-oauth first; never embed OAuth values in Git.
          oauthSecretVolume:
            secret:
              secretName: operator-oauth
              defaultMode: 0444
          operatorConfig:
            hostname: lab-operator
            defaultTags: ["tag:k8s-operator"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          proxyConfig:
            defaultTags: "tag:k8s"
          apiServerProxyConfig:
            mode: "false"
            allowImpersonation: "false"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-configs
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: tailscale
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /spec/externalName
      kind: Service
  project: default
  source:
    path: tailscale_configs
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
