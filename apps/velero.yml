apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /data
      kind: Secret
  project: default
  sources:
  - path: velero_auth
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
    ref: imageValues
  - chart: velero
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/velero.yml
      valuesObject:
        # Restore the original YAML's PVC filesystem backups.
        deployNodeAgent: true
        snapshotsEnabled: false
        upgradeCRDs: false
        cleanUpCRDs: false
        credentials:
          existingSecret: velero-s3
        serviceAccount:
          server:
            name: velero
        rbac:
          clusterAdministrator: true
        nodeAgent:
          podSecurityContext:
            runAsUser: 0
          containerSecurityContext:
            privileged: false
        podSecurityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          fsGroup: 0
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          # Native filesystem-backup repository initialization writes /udmrepo.
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
        configuration:
          repositoryMaintenanceJob:
            repositoryConfigData:
              global:
                keepLatestMaintenanceJobs: 0
          fsBackupTimeout: 12h
          defaultVolumesToFsBackup: true
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              credential:
                name: velero-s3
                key: cloud
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://pmhraspberry.tailscale.svc.cluster.local:9000
                checksumAlgorithm: ""
        schedules:
          backup:
            disabled: false
            schedule: "0 0 * * *"
            useOwnerReferencesInBackup: false
            paused: false
            skipImmediately: false
            template:
              ttl: "720h"
              storageLocation: default
              defaultVolumesToFsBackup: true
              snapshotVolumes: false
              uploaderConfig:
                parallelFilesUpload: 16
              excludedResources:
                - podvolumebackups.velero.io
                - podvolumerestores.velero.io
                - backups.velero.io
                - restores.velero.io
                - downloadrequests.velero.io
                - deletebackuprequests.velero.io
                - serverstatusrequests.velero.io
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 12.2.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /data
      kind: Secret
  project: default
  sources:
  - repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
    ref: imageValues
  - chart: velero-ui
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/velero-ui.yml
      valuesObject:
        configuration:
          general:
            secretPassPhrase:
              existingSecret: velero-ui-secrets
              key: AUTH_SECRET_PASSPHRASE
          policies:
            enabled: true
            # OAuth authentication alone grants no API access in UI 0.11.
            # Match the existing active internal Authentik administrator email.
            value: |
              u,pmh_only@pmh.codes,manage,all
        env:
          - name: BASIC_AUTH_ENABLED
            value: "false"
          - name: OAUTH_AUTH_ENABLED
            value: "true"
          - name: OAUTH_NAME
            value: pmh.codes
          - name: OAUTH_AUTHORIZATION_URL
            value: https://auth.pmh.codes/application/o/authorize/
          - name: OAUTH_USER_INFO_URL
            value: https://auth.pmh.codes/application/o/userinfo/
          - name: OAUTH_TOKEN_URL
            value: https://auth.pmh.codes/application/o/token/
          - name: OAUTH_CLIENT_ID
            value: lab-velero-ui
          - name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: velero-ui-secrets
                key: OAUTH_CLIENT_SECRET
          - name: OAUTH_REDIRECT_URI
            value: https://velero.pmh.codes/login
    repoURL: https://helm.otwld.com
    targetRevision: 1.0.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui-configs
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  project: default
  source:
    path: velero-ui_configs
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
