apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /data
      kind: Secret
  project: default
  sources:
  - path: velero_auth
    repoURL: https://github.com/pmh-only/lab.git
    targetRevision: HEAD
  - chart: velero
    helm:
      valuesObject:
        # Kubernetes objects only. Native DB dumps provide logical consistency;
        # no privileged filesystem agents or misleading live-volume snapshots.
        deployNodeAgent: false
        snapshotsEnabled: false
        upgradeCRDs: false
        cleanUpCRDs: false
        image:
          tag: v1.18.2
          digest: sha256:37396519f399536e5f01427d723565ae69294ec3fb5625cf1c87c09eaa9de16b
        credentials:
          existingSecret: velero-s3
        serviceAccount:
          server:
            name: velero
        rbac:
          clusterAdministrator: false
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        configuration:
          defaultVolumesToFsBackup: false
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              credential:
                name: velero-s3
                key: cloud
              config:
                region: us-east-1
                s3ForcePathStyle: "true"
                s3Url: http://pmhraspberry.tailscale.svc.cluster.local:9000
                checksumAlgorithm: ""
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.0@sha256:7e82f717f44e89671212e0dfce7e061321c386ea84a33bca64a671670ca6c278
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
              - mountPath: /target
                name: plugins
        schedules:
          cluster-metadata:
            disabled: false
            schedule: "0 0 * * *"
            useOwnerReferencesInBackup: false
            paused: false
            # This is a one-shot flag reset by the controller, not a permanent
            # desired state. Initial metadata backup/restore has already passed.
            skipImmediately: false
            template:
              ttl: "720h"
              storageLocation: default
              defaultVolumesToFsBackup: false
              snapshotVolumes: false
              excludedNamespaces:
                - backup-restore-*
                - backup-velero-*
              excludedResources:
                - podvolumebackups.velero.io
                - podvolumerestores.velero.io
                - backups.velero.io
                - restores.velero.io
                - downloadrequests.velero.io
                - deletebackuprequests.velero.io
                - serverstatusrequests.velero.io
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 12.2.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - jsonPointers:
        - /data
      kind: Secret
  project: default
  source:
    chart: velero-ui
    helm:
      valuesObject:
        env:
          - name: BASIC_AUTH_ENABLED
            value: "false"
          - name: OAUTH_AUTH_ENABLED
            value: "true"
          - name: OAUTH_NAME
            value: pmh.codes
          - name: OAUTH_AUTHORIZATION_URL
            value: https://auth.pmh.codes/application/o/authorize/
          - name: OAUTH_USER_INFO_URL
            value: http://authentik-service.authentik.svc.cluster.local:9000/application/o/userinfo/
          - name: OAUTH_TOKEN_URL
            value: http://authentik-service.authentik.svc.cluster.local:9000/application/o/token/
          - name: OAUTH_CLIENT_ID
            value: jiqFkzGXFxXeRcYUJNRkPnwvh6acq0a0kCwAy0R9
          - name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: velero-ui-secrets
                key: OAUTH_CLIENT_SECRET
          - name: OAUTH_REDIRECT_URI
            value: https://velero.pmh.codes/login
    repoURL: https://helm.otwld.com
    targetRevision: x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui-configs
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  project: default
  source:
    path: velero-ui_configs
    repoURL: git@github.com:pmh-only/lab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
