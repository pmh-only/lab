apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: as218822-certificate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: as218822
    server: https://kubernetes.default.svc
  project: default
  source:
    path: as218822-certificate
    repoURL: git@github.com:pmh-only/lab.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
