apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otp
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: otp
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: otp_configs
      ref: imageValues
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: HEAD
    - chart: otp-inbox
      helm:
        releaseName: otp-inbox
        valueFiles:
          - $imageValues/image-updater/helm-values/otp.yml
        valuesObject:
          bitwarden:
            # The Bitwarden service was explicitly retired by the owner.
            enabled: false

          passkey:
            enabled: true
            existingClaim: otp-passkey

          secrets:
            existingSecret: otp-inbox

          gatewayApi:
            # Native locked snapshots, token/origin guards and WebAuthn checked.
            enabled: true
            annotations:
              argocd.argoproj.io/sync-wave: "1"
            parentRefs:
              - name: main
                namespace: gateway
            hostnames:
              - otp.pmh.codes
            filters:
              # Preserve the baseline Gateway; stream native SSE immediately.
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: X-Accel-Buffering
                      value: "no"

          config:
            connectDiscoveryUrl: http://connect-service.connect.svc.cluster.local:8080/.well-known/rostack
            mailDiscoveryUrl: http://mailui.mail.svc.cluster.local:3000/.well-known/rostack

      repoURL: https://pmh-only.github.io/otp
      targetRevision: x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
