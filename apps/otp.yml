apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otp
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: otp
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: otp_configs
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: HEAD
    - chart: otp-inbox
      helm:
        releaseName: otp-inbox
        valuesObject:
          image:
            tag: v0.4.0@sha256:caa00c49474cdb4e184dfe3f8a71dd187b369e51ae9234c52295a2c8667d11f7
          bitwarden:
            # The Bitwarden service was explicitly retired by the owner.
            enabled: false

          passkey:
            enabled: true
            existingClaim: otp-passkey

          secrets:
            existingSecret: otp-inbox

          gatewayApi:
            # Native locked snapshots, token/origin guards and WebAuthn checked.
            enabled: true
            annotations:
              argocd.argoproj.io/sync-wave: "1"
            parentRefs:
              - name: main
                namespace: gateway
            hostnames:
              - otp.pmh.codes

          config:
            connectDiscoveryUrl: http://connect-service.connect.svc.cluster.local:8080/.well-known/rostack
            mailDiscoveryUrl: http://mailui.mail.svc.cluster.local:3000/.well-known/rostack

      repoURL: https://pmh-only.github.io/otp
      targetRevision: 0.4.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
