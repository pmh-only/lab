apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otp
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: otp
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: otp_configs
      repoURL: git@github.com:pmh-only/lab.git
      targetRevision: HEAD
    - chart: otp-inbox
      helm:
        valuesObject:
          bitwarden:
            enabled: true
            server: https://vault.pmh.codes

          passkey:
            enabled: true
            storageClass: local-path

          secrets:
            existingSecret: otp-inbox

          gatewayApi:
            enabled: true
            parentRefs:
              - name: main
                namespace: gateway
            hostnames:
              - otp.pmh.codes

          config:
            connectDiscoveryUrl: http://connect-service.connect.svc.cluster.local:8080/.well-known/rostack
            mailDiscoveryUrl: http://mailui.mail.svc.cluster.local:3000/.well-known/rostack

      repoURL: https://pmh-only.github.io/otp
      targetRevision: x
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
