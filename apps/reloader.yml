apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: reloader
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: reloader
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/reloader.yml
      valuesObject:
        reloader:
          reloadOnCreate: true
          reloadOnDelete: true
          syncAfterRestart: true
          autoReloadAll: true
          ignoreNamespaces: tailscale
          revisionHistoryLimit: 0
    repoURL: https://stakater.github.io/stakater-charts
    targetRevision: 2.2.18
  - repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
    ref: imageValues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
