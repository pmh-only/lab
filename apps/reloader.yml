apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: reloader
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: reloader
    helm:
      valuesObject:
        image:
          digest: sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c
        reloader:
          reloadOnCreate: true
          reloadOnDelete: true
          syncAfterRestart: true
          autoReloadAll: true
          ignoreNamespaces: tailscale
          revisionHistoryLimit: 0
    repoURL: https://stakater.github.io/stakater-charts
    targetRevision: 2.2.18
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
