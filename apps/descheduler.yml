apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: descheduler
    server: https://kubernetes.default.svc
  project: default
  sources:
  - chart: descheduler
    helm:
      valueFiles:
        - $imageValues/image-updater/helm-values/descheduler.yml
      valuesObject:
        kind: Deployment
    repoURL: https://kubernetes-sigs.github.io/descheduler/
    targetRevision: x
  - repoURL: https://github.com/pmh-only/lab.git
    targetRevision: main
    ref: imageValues
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
