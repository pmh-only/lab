apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: gateway
    server: https://kubernetes.default.svc
  project: default
  sources:
    - path: gateway
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: HEAD
    # Keep existing route namespaces; the gateway Kustomization sets its own.
    - path: gateway/routes
      repoURL: https://github.com/pmh-only/lab.git
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
