---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: stmt-secret
  namespace: stmt
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: stmt/stmt-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: stmt-secret
    type: Opaque
    labels:
      app.kubernetes.io/instance: stmt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: stmt
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: stmt
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: stmt
    serviceAccount: vault-auth
    audiences:
    - vault
