<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142233">
  <meta name="description" content="pmh.codes 인프라 아키텍처 — 고해상도 Deep Zoom 탐색">
  <title>아키텍처 · pmh.codes</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/openseadragon/openseadragon.min.js" defer></script>
  <script src="/viewer.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/">pmh.codes <span>아키텍처</span></a>
    <p id="dimensions">고해상도 인프라 지도</p>
    <nav aria-label="원본 다운로드">
      <a id="download-png" hidden download>PNG ↓</a>
      <a id="download-drawio" hidden download>draw.io ↓</a>
    </nav>
  </header>
  <main id="viewer" aria-label="인프라 아키텍처 확대 보기" tabindex="0"></main>
  <div id="status" role="status" aria-live="polite">고해상도 타일을 불러오는 중…</div>
  <aside class="tools" aria-label="지도 도구">
    <button id="zoom-in" aria-label="확대" title="확대">＋</button>
    <button id="zoom-out" aria-label="축소" title="축소">−</button>
    <button id="home" aria-label="전체 보기" title="전체 보기 (H)">⌂</button>
    <button id="fullscreen" aria-label="전체 화면" title="전체 화면 (F)">⛶</button>
    <label class="sr-only" for="region">영역 이동</label>
    <select id="region">
      <option value="all">전체 보기</option>
      <option value="entry">사용자 · 진입 경로</option>
      <option value="nodes">VM · 클러스터 운영</option>
      <option value="apps">앱 내부 구성</option>
      <option value="identity">인증 · Secret</option>
      <option value="observability">모니터링 · 로그</option>
      <option value="routing">AS218822 · 라우팅</option>
      <option value="storage">DB · PVC · 공유 저장소</option>
      <option value="external">외부 장치 · 백업</option>
    </select>
  </aside>
  <footer><span>드래그 이동 · 휠 / 두 손가락 확대</span><output id="zoom">—</output></footer>
</body>
</html>
