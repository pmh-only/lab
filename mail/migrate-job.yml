apiVersion: batch/v1
kind: Job
metadata:
  name: mailui-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/pmh-only/mail:latest
          command: [node, /app/node_modules/drizzle-kit/bin.cjs, migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mailui-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
