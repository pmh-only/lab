---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: office-secret
  namespace: office
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: office/office-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: office-secret
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: office
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: office
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: office
    serviceAccount: vault-auth
    audiences:
    - vault
