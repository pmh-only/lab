apiVersion: v1
kind: ConfigMap
metadata:
  name: office-cm
  namespace: office
data:
  local-production-linux.json: |
    {
      "services": {
        "CoAuthoring": {
          "autoAssembly": {
            "enable": true,
            "interval": "5m"
          },
          "token": {
            "outbox": {
              "urlExclusionRegex": ".s3.pmh.codes/"
            }
          }
        }
      },
      "FileConverter": {
        "converter": {
          "downloadAttemptMaxCount": 3
        }
      }
    }
