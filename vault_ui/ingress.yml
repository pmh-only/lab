apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: vault-ui-backend-tls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: vault-ui
  validation:
    hostname: vault.vault.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: vault-ui-backend-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui-route
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - vault.pmh.codes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: vault-ui
          port: 8200
