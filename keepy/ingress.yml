apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keepy-route
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: gateway
  hostnames:
    - keepy.pmh.codes
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: keepy-service
          port: 3001
          weight: 1
