apiVersion: apps/v1
kind: Deployment
metadata:
  name: here
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: here
  template:
    metadata:
      labels:
        app: here
    spec:
      containers:
        - name: here
          image: ghcr.io/pmh-only/here:latest
          env:
            - name: SSH_LISTEN_ADDR
              value: ":22"
            - name: DATA_PATH
              value: "/data"
            - name: HTTP_HOST_PREFIX
              value: "https://"
            - name: SSH_DOMAIN
              value: "here.pmh.codes"
            - name: HTTP_HOST_SUFFIX
              value: ".here.pmh.codes"
            - name: UNAUTHENTICATED_TIMEOUT
              value: "5m"
            - name: SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: here-secret
                  key: SSH_PASSWORD
          volumeMounts:
            - mountPath: /data
              name: persistent
      volumes:
        - name: persistent
          persistentVolumeClaim:
            claimName: here-pvc
