---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-secret
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: immich/immich-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: immich-secret
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: immich
    serviceAccount: vault-auth
    audiences:
    - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-bootstrap-login
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: immich/bootstrap-login
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: immich-bootstrap-login
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: immich-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: immich/immich-oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: immich-oidc
    type: Opaque
