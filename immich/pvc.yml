apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgsql-pvc
  annotations:
    # local-path waits for its first Pod before binding this claim.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
