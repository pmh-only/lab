apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      labels:
        app: immich
    spec:
      automountServiceAccountToken: false
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:release
          ports:
            - containerPort: 2283
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
          env:
            - name: IMMICH_MEDIA_LOCATION
              value: /usr/src/app/upload
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_VECTOR_EXTENSION
              value: vectorchord
            - name: DB_USERNAME
              value: immich
            - name: DB_HOSTNAME
              value: pgsql-service.immich.svc.cluster.local
            - name: REDIS_HOSTNAME
              value: redis-service.database.svc.cluster.local
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: immich-secret
          volumeMounts:
            - mountPath: /usr/src/app/upload
              name: immich-pvc
      volumes:
        - name: immich-pvc
          hostPath:
            path: /mnt/data/immich
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
    spec:
      automountServiceAccountToken: false
      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:release
          ports:
            - containerPort: 3003
          startupProbe:
            tcpSocket:
              port: 3003
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3003
          volumeMounts:
            - mountPath: /cache
              name: immich-ml-pvc
      volumes:
        - name: immich-ml-pvc
          hostPath:
            path: /mnt/data/immich-ml
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgsql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: pgsql
  template:
    metadata:
      labels:
        app: pgsql
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      initContainers:
        - name: backpack
          restartPolicy: Always
          image: ghcr.io/pmh-only/backpack-pgsql2s3:latest
          env:
            - name: TZ
              value: Asia/Seoul
            - name: DATABASE_HOST
              value: "127.0.0.1"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: "admin"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_ADMIN_PASSWORD
            - name: S3_DUMP_URI
              value: dbdump/pgsql-immich
            - name: S3_ENDPOINT_URL
              value: "http://pmhraspberry.tailscale.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: S3_ACCESS_TOKEN
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: S3_SECRET_TOKEN
            - name: AWS_REGION
              value: us-east-1
      containers:
        - name: pgsql
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          ports:
            - containerPort: 5432
          startupProbe:
            tcpSocket:
              port: 5432
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_ADMIN_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
          volumeMounts:
            - name: native-bootstrap
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: app-credential
              mountPath: /run/secrets/immich-db
              readOnly: true
            - mountPath: /var/lib/postgresql/data
              name: pgsql-storage
      volumes:
        - name: native-bootstrap
          configMap:
            name: immich-db-bootstrap
            defaultMode: 0555
        - name: app-credential
          secret:
            secretName: immich-secret
            defaultMode: 0440
        - name: pgsql-storage
          persistentVolumeClaim:
            claimName: pgsql-pvc
