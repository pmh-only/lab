apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - ./secret.yml
  - ./deployment.yml
  - ./service.yml
  # Native admin, editable OAuth/UI, media I/O and local backup checks passed.
  - ./ingress.yml
  - ./pvc.yml
  - ./initialize-job.yml
configMapGenerator:
  - name: immich-db-bootstrap
    files:
      - db-init.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: immich-owner-bootstrap
    files:
      - initialize-owner.py
      - bootstrap.json
# Backups to the real Tailscale/S3 target remain deferred as requested.
# Native Immich local database backup features are not disabled.
patches:
  - target:
      kind: Deployment
      name: pgsql
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pgsql
      spec:
        template:
          spec:
            initContainers:
              - name: backpack
                $patch: delete
images:
  - name: ghcr.io/immich-app/immich-server
    newTag: release
    digest: sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: release
    digest: sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
  - name: ghcr.io/immich-app/postgres
    newTag: 14-vectorchord0.4.3-pgvectors0.2.0
    digest: sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
