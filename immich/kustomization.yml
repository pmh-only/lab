apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - ./secret.yml
  - ./deployment.yml
  - ./service.yml
  # Native admin, editable OAuth/UI, media I/O and local backup checks passed.
  - ./ingress.yml
  - ./pvc.yml
  - ./initialize-job.yml
configMapGenerator:
  - name: immich-db-bootstrap
    files:
      - db-init.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: immich-owner-bootstrap
    files:
      - initialize-owner.py
      - bootstrap.json
# Database offsite backups are managed by the backup CronJobs, not a sidecar.
# Native Immich local database backups remain enabled.
images:
  - name: ghcr.io/immich-app/immich-server
    newTag: release
    digest: sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
  - name: ghcr.io/immich-app/immich-machine-learning
    newTag: release
    digest: sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2
  - name: ghcr.io/immich-app/postgres
    newTag: 14-vectorchord0.4.3-pgvectors0.2.0
    digest: sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
