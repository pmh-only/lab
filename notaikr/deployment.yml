apiVersion: apps/v1
kind: Deployment
metadata:
  name: notaikr
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: notaikr
  template:
    metadata:
      labels:
        app: notaikr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notaikr
          image: ghcr.io/pmh-only/notaikr:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          env:
            - name: OPENAI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notaikr-secret
                  key: OPENAI_TOKEN
