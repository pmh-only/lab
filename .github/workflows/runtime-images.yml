name: Reviewed runtime images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/**
      - .dockerignore
      - .github/workflows/runtime-images.yml
      - trace/prepare-clickhouse-client.mjs
      - spotify/prepare-api.mjs
      - seafile/prepare_mysql_plugins.py
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: reviewed-runtime-images
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [trace, spotify, seafile, goaccess, nameserver]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable upstream inputs
        id: inputs
        run: python3 images/resolve.py '${{ matrix.image }}' >> "$GITHUB_OUTPUT"
      - name: Check whether these exact inputs were already built
        id: cache
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/lab-${{ matrix.image }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish only after image validation
        if: steps.cache.outputs.built != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/lab-${{ matrix.image }}:${{ steps.inputs.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/lab-${{ matrix.image }}:latest
          build-args: |
            BASE_IMAGE=${{ steps.inputs.outputs.base }}
            GEOIP_IMAGE=${{ steps.inputs.outputs.geoip }}
            PYTHON_REQUIREMENTS=${{ steps.inputs.outputs.python_requirements }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=reviewed-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=reviewed-${{ matrix.image }}
