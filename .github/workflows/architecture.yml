name: Architecture viewer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - arch/Dockerfile
      - arch/Dockerfile.dockerignore
      - arch/package*.json
      - arch/*.mjs
      - arch/source.json
      - arch/site/**
      - arch/nginx.conf
      - docs/architecture/lab-architecture.drawio
      - docs/architecture/lab-architecture-hires.png
      - .github/workflows/architecture.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: architecture-viewer
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, validate tiles, and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: arch/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          tags: ghcr.io/${{ github.repository_owner }}/lab-arch:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=architecture
          cache-to: type=gha,mode=max
