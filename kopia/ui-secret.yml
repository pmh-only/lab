apiVersion: v1
kind: ServiceAccount
metadata:
  name: kopia-ui-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: kopia-ui
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kopia-ui
    serviceAccount: kopia-ui-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kopia-ui-s3
spec:
  vaultAuthRef: kopia-ui
  mount: secret
  type: kv-v2
  path: kopia/ui-s3
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: kopia-ui-s3
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kopia-ui-auth
spec:
  vaultAuthRef: kopia-ui
  mount: secret
  type: kv-v2
  path: kopia/ui-auth
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: kopia-ui-auth
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kopia-auth-secret
spec:
  vaultAuthRef: kopia-ui
  mount: secret
  type: kv-v2
  path: kopia/kopia-auth-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: kopia-auth-secret
    type: Opaque
