apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopia
spec:
  replicas: 1
  # Keep the original single persistent server; never overlap PVC writers.
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: kopia
  template:
    metadata:
      labels:
        app: kopia
    spec:
      hostname: pmhoci
      nodeSelector:
        kubernetes.io/hostname: pmhoci
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: connect-repository
          image: kopia/kopia:latest
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              if [ -e /app/config/repository.config ] && [ ! -e /app/config/.lab-managed-repository ]; then
                echo 'Unmanaged persistent repository configuration; refusing replacement' >&2
                exit 1
              fi
              # Connect the existing repository with its existing password.
              # Never create, reset, or change its encryption settings.
              kopia repository connect s3 --bucket=kopia \
                --endpoint=pmhraspberry.tailscale.svc.cluster.local:9000 \
                --disable-tls --region=us-east-1 --no-check-for-updates \
                --override-hostname=pmhoci --override-username=lab > /tmp/connect.log 2>&1 || {
                  echo 'Existing backup repository connection failed; details suppressed' >&2; exit 1;
                }
              touch /app/config/.lab-managed-repository
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: KOPIA_CONFIG_PATH, value: /app/config/repository.config}
            - {name: KOPIA_CACHE_DIRECTORY, value: /app/cache}
            - {name: KOPIA_LOG_DIR, value: /app/logs}
            - name: KOPIA_PASSWORD
              valueFrom:
                secretKeyRef: {name: kopia-secret, key: REPOSITORY_PASSWORD}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: kopia-secret, key: S3_ACCESS_TOKEN}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: kopia-secret, key: S3_SECRET_TOKEN}
          volumeMounts:
            - {name: persistent, mountPath: /app/config, subPath: config}
            - {name: persistent, mountPath: /app/cache, subPath: cache}
            - {name: persistent, mountPath: /app/logs, subPath: logs}
            - {name: persistent, mountPath: /tmp, subPath: tmp}
      containers:
        - name: kopia
          image: kopia/kopia:latest
          args:
            - server
            - start
            - --insecure
            - --address=127.0.0.1:51515
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 2Gi}
          env:
            - {name: KOPIA_SERVER_USERNAME, value: pmh_only@pmh.codes}
            - {name: KOPIA_CONFIG_PATH, value: /app/config/repository.config}
            - {name: KOPIA_CACHE_DIRECTORY, value: /app/cache}
            - {name: KOPIA_LOG_DIR, value: /app/logs}
            - name: KOPIA_SERVER_PASSWORD
              valueFrom:
                secretKeyRef: {name: kopia-secret, key: ADMIN_PASSWORD}
            - name: KOPIA_PASSWORD
              valueFrom:
                secretKeyRef: {name: kopia-secret, key: REPOSITORY_PASSWORD}
          volumeMounts:
            - {name: persistent, mountPath: /app/config, subPath: config}
            - {name: persistent, mountPath: /app/cache, subPath: cache}
            - {name: persistent, mountPath: /app/logs, subPath: logs}
            - {name: persistent, mountPath: /tmp, subPath: tmp}
            - {name: target, mountPath: /data, readOnly: true}
        # Authentik authenticates at the gateway; keep Kopia's password inside
        # the Pod instead of asking the browser for a second login.
        - name: proxy
          image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              export KOPIA_BASIC_AUTH="Basic $(printf '%s:%s' "$KOPIA_SERVER_USERNAME" "$KOPIA_SERVER_PASSWORD" | base64 | tr -d '\n')"
              envsubst '${KOPIA_BASIC_AUTH}' < /config/nginx.conf.template > /run/nginx.conf
              unset KOPIA_BASIC_AUTH KOPIA_SERVER_PASSWORD
              exec nginx -c /run/nginx.conf -g 'daemon off;'
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          env:
            - {name: KOPIA_SERVER_USERNAME, value: pmh_only@pmh.codes}
            - name: KOPIA_SERVER_PASSWORD
              valueFrom:
                secretKeyRef: {name: kopia-secret, key: ADMIN_PASSWORD}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: proxy-config, mountPath: /config, readOnly: true}
            - {name: proxy-run, mountPath: /run}
      volumes:
        - name: proxy-run
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: proxy-config
          configMap: {name: kopia-ui-proxy}
        - name: persistent
          persistentVolumeClaim: {claimName: kopia-pvc}
        - name: target
          hostPath: {path: /mnt/data/, type: Directory}
