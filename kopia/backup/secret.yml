apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kopia
    serviceAccount: vault-auth
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kopia-backup
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: kopia/s3
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: kopia-backup
    type: Opaque
