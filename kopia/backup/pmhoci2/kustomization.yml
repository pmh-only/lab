apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -pmhoci2
resources:
  - ../base
patches:
  - target:
      kind: CronJob
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: kopia-files
      spec:
        schedule: "0 6 * * *"
        jobTemplate:
          spec:
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: pmhoci2
