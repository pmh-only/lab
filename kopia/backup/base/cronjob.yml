apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopia-files
  annotations:
    reloader.stakater.com/auto: "false"
spec:
  schedule: "0 5 * * *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "false"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 86400
      template:
        metadata:
          annotations:
            reloader.stakater.com/auto: "false"
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: pmhoci
          securityContext:
            # Host data has many different owners. Read-only mounts and this
            # single capability allow backup reads without a privileged Pod.
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kopia
              image: kopia/kopia:latest@sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
                  add: [DAC_READ_SEARCH]
              command:
                - sh
                - -c
                - |
                  set -eu
                  umask 077
                  kopia repository connect s3 --bucket=kopia \
                    --endpoint=pmhraspberry.tailscale.svc.cluster.local:9000 \
                    --disable-tls --region=us-east-1 --no-check-for-updates \
                    --override-hostname="$BACKUP_NODE" --override-username=lab > /work/connect.log 2>&1 || {
                      echo 'Kopia connection failed; details suppressed' >&2; exit 1;
                    }
                  # Pin snapshots until a retention policy is explicitly reviewed.
                  kopia snapshot create --fail-fast --pin=retention-review --json /source > /work/snapshot.json 2> /work/snapshot.log || {
                    echo 'Kopia file snapshot failed; details suppressed' >&2; exit 1;
                  }
                  kopia snapshot verify --verify-files-percent=1 > /work/verify.log 2>&1 || {
                    echo 'Kopia remote snapshot verification failed' >&2; exit 1;
                  }
                  echo "Kopia encrypted file snapshot completed and sampled: $BACKUP_NODE"
              env:
                - name: BACKUP_NODE
                  valueFrom:
                    fieldRef: {fieldPath: spec.nodeName}
                - {name: HOME, value: /work}
                - {name: KOPIA_CONFIG_PATH, value: /work/repository.config}
                - {name: KOPIA_CACHE_DIRECTORY, value: /work/cache}
                - {name: KOPIA_LOG_DIR, value: /work/logs}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: kopia-backup, key: S3_ACCESS_TOKEN}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: kopia-backup, key: S3_SECRET_TOKEN}
                - name: KOPIA_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: kopia-backup, key: REPOSITORY_PASSWORD}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
                - {name: source-root, mountPath: /source}
                - {name: application-files, mountPath: /source/mnt-data, readOnly: true}
                - {name: persistent-volumes, mountPath: /source/k3s-storage, readOnly: true}
          volumes:
            - name: work
              emptyDir: {sizeLimit: 10Gi}
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
            - name: source-root
              emptyDir: {}
            - name: application-files
              hostPath: {path: /mnt/data, type: Directory}
            - name: persistent-volumes
              hostPath: {path: /var/lib/rancher/k3s/storage, type: Directory}
