---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kopia-secret
  namespace: kopia
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: kopia/kopia-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: kopia-secret
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: kopia-auth-secret
  namespace: kopia
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: kopia/kopia-auth-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: kopia-auth-secret
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: kopia
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: kopia
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: kopia
    serviceAccount: vault-auth
    audiences:
    - vault
