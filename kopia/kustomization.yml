apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kopia
resources:
  - ./deployment.yml
  - ./service.yml
  - ./ingress.yml
  - ./pvc.yml
  - ./secret.yml
  - ./networkpolicy.yml
configMapGenerator:
  - name: kopia-ui-proxy
    files:
      - nginx.conf.template
patches:
  - target:
      kind: (ServiceAccount|VaultAuth|VaultStaticSecret)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-2"
  - target:
      kind: NetworkPolicy
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: (HTTPRoute|SecurityPolicy)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
images:
  - name: kopia/kopia
    newTag: latest
    digest: sha256:89fd95ee2942880ca00eae964266958a394421ddbdf69bca62e38afc55f5900e
  - name: nginx
    newTag: stable-alpine
    digest: sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
