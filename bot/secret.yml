---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bot-secrets
  namespace: bot
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: bot/bot-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: bot-secrets
    type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: bot
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: bot
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: bot
    serviceAccount: vault-auth
    audiences:
    - vault
