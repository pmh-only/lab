---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: connect-secrets
  namespace: connect
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: connect/connect-secrets
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: connect-secrets
    type: Opaque
    labels:
      app.kubernetes.io/instance: connect
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: connect
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: connect
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: connect
    serviceAccount: vault-auth
    audiences:
    - vault
