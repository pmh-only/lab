---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: track-secret
  namespace: track
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: track/track-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: track-secret
    type: Opaque
    labels:
      app.kubernetes.io/instance: track
  rolloutRestartTargets:
    - kind: Deployment
      name: track
    - kind: Deployment
      name: track-sidekiq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: track
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: track
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: track
    serviceAccount: vault-auth
    audiences:
    - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: track-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: track/track-oidc
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: track-oidc
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: track-bootstrap-login
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: track/bootstrap-login
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: track-bootstrap-login
    type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: track-db-admin
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  vaultAuthRef: vault
  mount: secret
