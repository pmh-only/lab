---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: track-secret
  namespace: track
spec:
  vaultAuthRef: vault
  mount: secret
  type: kv-v2
  path: track/track-secret
  refreshAfter: 1m
  destination:
    create: true
    overwrite: false
    name: track-secret
    type: Opaque
    labels:
      app.kubernetes.io/instance: track
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: track
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault
  namespace: track
spec:
  vaultConnectionRef: vault/cluster
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: track
    serviceAccount: vault-auth
    audiences:
    - vault
