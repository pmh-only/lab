apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: track
resources:
  - ./secret.yml
  - ./deployment.yml
  - ./service.yml
  - ./pvc.yml
  # Private owner/API/worker/PostGIS/geocoding/OIDC checks verified.
  - ./ingress.yml
  - ./initialize-job.yml
configMapGenerator:
  - name: track-runtime
    envs: [runtime.env]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: track-bootstrap
    files: [initialize.sh, initialize-owner.rb]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: track-db-bootstrap
    files: [db-init.sh]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: track-(postgis|redis)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: Deployment
      name: track(|-sidekiq)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
images:
  - name: ghcr.io/pmh-only/dawarich
    newTag: latest
    digest: sha256:4ddd2ab69675e791e5e02c814369e82e0cd39f11780395ab17773ac4470309ac
  - name: ghcr.io/pmh-only/postgis
    newTag: 17-3.5-alpine
  - name: ghcr.io/pmh-only/redis
    newTag: alpine
    digest: sha256:0c9ff226d290de2878f875efe2ce49e93137469331d5b10d919ce96ce7b2fa5a
