apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: track
resources:
  - ./secret.yml
  - ./deployment.yml
  - ./service.yml
  - ./pvc.yml
  # Private owner/API/worker/PostGIS/geocoding/OIDC checks verified.
  - ./ingress.yml
  - ./initialize-job.yml
configMapGenerator:
  - name: track-runtime
    envs: [runtime.env]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: track-bootstrap
    files: [initialize.sh, initialize-owner.rb]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: track-db-bootstrap
    files: [db-init.sh]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: track-(postgis|redis)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: Deployment
      name: track(|-sidekiq)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
images:
  - name: ghcr.io/pmh-only/dawarich
    newTag: latest
    digest: sha256:2fde2a5073738de8730561e3b0b4874cb58dd32b3e2822e9c2d656bd5c82d8d3
  - name: ghcr.io/pmh-only/postgis
    newTag: 17-3.5-alpine
    digest: sha256:da061e8e41e25cf8cd7c661f600269c4a81fe765ea66263d8a49d4ef9e3c34d2
  - name: ghcr.io/pmh-only/redis
    newTag: alpine
    digest: sha256:25caa3e61863c0fba2088f934edada9926d54341809d115c8521f8deffee0def
