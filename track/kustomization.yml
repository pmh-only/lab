apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: track
resources:
  - ./secret.yml
  - ./deployment.yml
  - ./service.yml
  - ./pvc.yml
  # Private owner/API/worker/PostGIS/geocoding/OIDC checks verified.
  - ./ingress.yml
  - ./initialize-job.yml
configMapGenerator:
  - name: track-runtime
    envs: [runtime.env]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: track-bootstrap
    files: [initialize.sh, initialize-owner.rb]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  - name: track-db-bootstrap
    files: [db-init.sh]
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            automountServiceAccountToken: false
  - target:
      kind: Deployment
      name: track-(postgis|redis)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
  - target:
      kind: Deployment
      name: track(|-sidekiq)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
images:
  - name: ghcr.io/pmh-only/dawarich
    newTag: latest
    digest: sha256:5c3d31527fdb6e12996502ee72d0f0c37295f92b89a42678712e797b18b3e7d3
  - name: ghcr.io/pmh-only/postgis
    newTag: 17-3.5-alpine
    digest: sha256:85f9311ba7aa38a6afed931596c38c9738415af598cbc295224d41e1af4a140a
  - name: ghcr.io/pmh-only/redis
    newTag: alpine
    digest: sha256:42447a15c58ed2014f8b9ed5573488331bcc9f409043b16cf6d954a6b4a36590
