apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-postgis
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: track-postgis
  template:
    metadata:
      labels:
        app: track-postgis
    spec:
      containers:
        - name: track-postgis
          image: ghcr.io/pmh-only/postgis:17-3.5-alpine
          startupProbe:
            tcpSocket:
              port: 5432
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
          env:
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: track-db-admin
                  key: password
            - name: POSTGRES_DB
              value: 'dawarich'
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d/20-lab-track.sh
              name: database-bootstrap
              subPath: db-init.sh
              readOnly: true
            - mountPath: /run/secrets/track-db
              name: app-credential
              readOnly: true
            - mountPath: /var/shared
              name: track-pvc
              subPath: shared
            - mountPath: /var/lib/postgresql/data
              name: track-pvc
              subPath: dawarich_db_data
      volumes:
        - name: database-bootstrap
          configMap:
            name: track-db-bootstrap
            defaultMode: 0555
        - name: app-credential
          secret:
            secretName: track-secret
            defaultMode: 0444
            items:
              - key: DATABASE_PASSWORD
                path: DATABASE_PASSWORD
        - name: track-pvc
          persistentVolumeClaim:
            claimName: track-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-redis
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: track-redis
  template:
    metadata:
      labels:
        app: track-redis
    spec:
      containers:
        - name: track-redis
          image: ghcr.io/pmh-only/redis:alpine
          startupProbe:
            tcpSocket:
              port: 6379
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 6379
          args:
            - redis-server
            - --save
            - '900'
            - '1'
            - --save
            - '300'
            - '10'
            - --appendonly
            - 'no'
          volumeMounts:
            - mountPath: /data
              name: track-pvc
              subPath: shared
      volumes:
        - name: track-pvc
          persistentVolumeClaim:
            claimName: track-pvc
