apiVersion: apps/v1
kind: Deployment
metadata:
  name: track
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: track
  template:
    metadata:
      labels:
        app: track
    spec:
      containers:
        - name: track
          image: ghcr.io/pmh-only/dawarich:latest
          envFrom:
            - configMapRef:
                name: track-runtime
          command:
            - web-entrypoint.sh
          args:
            - bin/rails
            - server
            - '-p'
            - '3000'
            - '-b'
            - '::'
          env:
            - name: RAILS_ENV
              value: production
            - name: REDIS_URL
              value: redis://track-redis-service.track.svc.cluster.local:6379
            - name: DATABASE_HOST
              value: track-postgis-service.track.svc.cluster.local
            - name: DATABASE_PORT
              value: '5432'
            - name: DATABASE_USERNAME
              value: dawarich
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: track-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              value: postgis://dawarich:$(DATABASE_PASSWORD)@track-postgis-service.track.svc.cluster.local:5432/dawarich
            - name: DATABASE_NAME
              value: 'dawarich'
            - name: APPLICATION_HOSTS
              value: track.pmh.codes
            - name: TIME_ZONE
              value: Asia/Seoul
            - name: APPLICATION_PROTOCOL
              value: https
            - name: PROMETHEUS_EXPORTER_ENABLED
              value: 'false'
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: track-secret
                  key: SECRET_KEY_BASE
            - name: RAILS_LOG_TO_STDOUT
              value: 'true'
            - name: SELF_HOSTED
              value: 'true'
            - name: STORE_GEODATA
              value: 'true'
            - name: WEB_CONCURRENCY
              value: '1'
            - name: PHOTON_API_HOST
              value: app.chibigeo.com/v1/photon
            - name: PHOTON_API_USE_HTTPS
              value: 'true'
            - name: PHOTON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: track-secret
                  key: PHOTON_API_KEY
            - name: ALLOW_EMAIL_PASSWORD_REGISTRATION
              value: 'false'
            - name: ALLOW_EMAIL_PASSWORD_LOGIN
              value: 'false'
            - name: OIDC_CLIENT_ID
              value: z7QIEBurowgWfYPDxOLRa7Nx8kJdHGirkCtOlwM4
            - name: OIDC_ISSUER
              value: https://auth.pmh.codes/application/o/track/
            - name: OIDC_REDIRECT_URI
              value: https://track.pmh.codes/users/auth/openid_connect/callback
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: track-oidc
                  key: OIDC_CLIENT_SECRET
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
              httpHeaders:
                - name: Host
                  value: track.pmh.codes
                - name: X-Forwarded-Proto
                  value: https
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3000
              httpHeaders:
                - name: Host
                  value: track.pmh.codes
                - name: X-Forwarded-Proto
                  value: https
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /var/app/public
              name: track-pvc
              subPath: public
            - mountPath: /var/app/tmp/imports/watched
              name: track-pvc
              subPath: watched
            - mountPath: /var/app/storage
              name: track-pvc
              subPath: storage
      volumes:
        - name: track-pvc
          persistentVolumeClaim:
            claimName: track-pvc
---
